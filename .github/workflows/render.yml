name: Render Video

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Target video slug(s) — comma-separated, 'all', or 'auto'"
        required: false
        default: "auto"
      quality:
        description: "Render quality (high | draft)"
        required: false
        default: "high"
      create_release:
        description: "Create GitHub Release and attach MP4"
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "videos/**"

permissions:
  contents: write

jobs:
  find-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect video projects
        id: set-matrix
        run: |
          INPUT_SLUGS="${{ inputs.slugs || 'auto' }}"
          TARGETS=()

          if [ "$INPUT_SLUGS" = "all" ]; then
            for d in videos/*/; do
              if [ -f "${d}index.html" ]; then
                TARGETS+=("$(basename "$d")")
              fi
            done
          elif [ "$INPUT_SLUGS" != "auto" ] && [ -n "$INPUT_SLUGS" ]; then
            IFS=', ' read -r -a SPLIT <<< "$INPUT_SLUGS"
            for s in "${SPLIT[@]}"; do
              s_trimmed=$(echo "$s" | xargs)
              if [ -n "$s_trimmed" ] && [ -f "videos/$s_trimmed/index.html" ]; then
                TARGETS+=("$s_trimmed")
              fi
            done
          else
            CHANGED_SLUGS=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^videos/' | cut -d/ -f2 | sort -u || true)
            for s in $CHANGED_SLUGS; do
              if [ -f "videos/$s/index.html" ]; then
                TARGETS+=("$s")
              fi
            done
            if [ ${#TARGETS[@]} -eq 0 ]; then
              for d in videos/*/; do
                if [ -f "${d}index.html" ]; then
                  TARGETS+=("$(basename "$d")")
                fi
              done
            fi
          fi

          readarray -t UNIQUE_TARGETS < <(printf '%s\n' "${TARGETS[@]}" | sort -u | grep -v '^$' || true)

          if [ ${#UNIQUE_TARGETS[@]} -eq 0 ]; then
            echo "No video projects found to render."
            echo "has_targets=false" >> $GITHUB_OUTPUT
            echo "matrix={}" >> $GITHUB_OUTPUT
          else
            JSON_ARRAY=$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "${UNIQUE_TARGETS[@]}")
            echo "Found target videos: $JSON_ARRAY"
            echo "has_targets=true" >> $GITHUB_OUTPUT
            echo "matrix={\"slug\": $JSON_ARRAY}" >> $GITHUB_OUTPUT
          fi

  render:
    needs: find-targets
    if: needs.find-targets.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.find-targets.outputs.matrix) }}
    env:
      PRODUCER_LOW_MEMORY_MODE: "false"
      RENDER_WORKERS: "4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install HyperFrames
        run: npm install -g hyperframes@0.8.145

      - name: Ensure Render Browser
        run: hyperframes browser ensure

      - name: Execute Render for ${{ matrix.slug }}
        run: |
          mkdir -p output
          SLUG="${{ matrix.slug }}"
          QUALITY="${{ inputs.quality || 'high' }}"
          echo "Rendering project: $SLUG with quality: $QUALITY on 4 parallel workers..."
          node tools/render-one.mjs --slug "$SLUG" --quality "$QUALITY" --workers 4

      - name: Verify Output Deliverable
        run: |
          ls -lh output/
          if [ ! -f "output/${{ matrix.slug }}.mp4" ]; then
            echo "::error::Output deliverable output/${{ matrix.slug }}.mp4 was not generated!"
            exit 1
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ matrix.slug }}-${{ github.run_number }}
          path: output/${{ matrix.slug }}.mp4
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release Deliverable
        if: ${{ inputs.create_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deliverable-${{ matrix.slug }}-${{ github.run_number }}
          name: "Video Deliverable: ${{ matrix.slug }}"
          body: |
            ## RenderedLabs Master Video Deliverable
            - **Slug:** `${{ matrix.slug }}`
            - **Render Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Commit:** `${{ github.sha }}`
            - **Generated:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          files: output/${{ matrix.slug }}.mp4
          draft: false
          prerelease: false
