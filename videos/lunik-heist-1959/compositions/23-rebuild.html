    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ---------- initial states ---------- */
      gsap.set("#s23-bg-dust circle", { opacity: 0 });
      gsap.set("#s23-panel-a", { opacity: 0, y: 40, rotationY: -18 });
      gsap.set("#s23-panel-b", { opacity: 0, y: 40, rotationY: 18 });
      gsap.set("#s23-plank-g", { opacity: 0, x: -30 });
      gsap.set("#s23-rope", { opacity: 0, strokeDasharray: 620, strokeDashoffset: 620 });
      gsap.set("#s23-crew-a", { opacity: 0, x: -24 });
      gsap.set("#s23-dim-a", { opacity: 0 });
      gsap.set("#s23-x-a1", { strokeDashoffset: 640 });
      gsap.set("#s23-x-a2", { strokeDashoffset: 640 });
      gsap.set("#s23-bloom", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" });
      gsap.set("#s23-hour", { strokeDashoffset: 792 });
      gsap.set("#s23-thread", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" });
      gsap.set("#s23-orb", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" });
      gsap.set("#s23-hand-a", { opacity: 0, y: 40 });
      gsap.set("#s23-hand-b", { opacity: 0, y: 40 });
      gsap.set("#s23-spark", { opacity: 0, scale: 0.4, transformOrigin: "930px 456px" });
      gsap.set("#s23-gauge", { opacity: 0, x: 26 });
      gsap.set("#s23-gauge-fill", { scaleY: 0, transformOrigin: "50% 100%" });
      gsap.set("#s23-gauge-needle", { y: 0 });
      gsap.set("#s23-gauge-flash", { opacity: 0 });
      gsap.set("#s23-plate-g", { opacity: 0, y: 30 });
      gsap.set("#s23-plate-sheen", { opacity: 0 });
      gsap.set("#s23-hb-scroll", { x: 0 });
      gsap.set("#s23-dust circle", { opacity: 0 });
      gsap.set("#s23-dark", { opacity: 0 });
      gsap.set("#s23-thread-glint", { opacity: 0, scale: 0.5, transformOrigin: "930px 404px" });
      gsap.set("#s23-badge", { opacity: 0, scale: 1.4, rotation: -4, transformOrigin: "50% 50%" });

      /* ---------- phase 1: two panels draw side by side ---------- */
      tl.to("#s23-bg-dust circle", { opacity: 0.12, duration: 0.7, stagger: 0.09, ease: "power1.out" }, 0.1);
      tl.to("#s23-panel-a", { opacity: 1, y: 0, rotationY: -14, duration: 0.85, ease: "power2.out" }, 0.2);
      tl.to("#s23-panel-b", { opacity: 1, y: 0, rotationY: 14, duration: 0.85, ease: "power2.out" }, 0.45);
      tl.to("#s23-plank-g", { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 0.8);
      tl.to("#s23-rope", { opacity: 1, strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 1.0);
      tl.to("#s23-crew-a", { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.25);

      /* ---------- phase 2: break-in dims and takes a violet X ---------- */
      tl.to("#s23-dim-a", { opacity: 0.5, duration: 0.9, ease: "power2.inOut" }, 2.3);
      tl.to("#s23-x-a1", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 2.7);
      tl.to("#s23-x-a2", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 2.85);
      tl.to("#s23-crew-a", { opacity: 0.35, duration: 0.6, ease: "power1.inOut" }, 2.7);
      tl.to("#s23-plank-g", { opacity: 0.45, duration: 0.6, ease: "power1.inOut" }, 2.75);

      /* rebuild panel blooms ember */
      tl.to("#s23-bloom", { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 2.6);
      tl.to("#s23-orb", { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 2.8);
      tl.to("#s23-thread", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 3.15);
      tl.to("#s23-hand-a", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.35);
      tl.to("#s23-hand-b", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.5);
