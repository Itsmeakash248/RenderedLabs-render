<!doctype html>

<body>
<template id="wbg-01-template">

  <style>
    #root { position: absolute; inset: 0; }

    [data-composition-id="wbg-01-yard-night"] .wbg-ground {

      position: absolute; inset: 0; width: 100%; height: 100%; display: block;

    [data-composition-id="wbg-01-yard-night"] .p-glow { opacity: 0.90; }
    [data-composition-id="wbg-01-yard-night"] .p-far { opacity: 0.72; }

    [data-composition-id="wbg-01-yard-night"] .wbg-scrim {
      position: absolute; inset: 0; pointer-events: none;

              <circle cx="1630" cy="190" r="3.0" fill="#B8C0D8" opacity="0.34"/>
              <circle cx="1780" cy="120" r="2.2" fill="#B8C0D8" opacity="0.26"/>
              <circle cx="80" cy="820" r="2.4" fill="#B8C0D8" opacity="0.24"/>
              <circle cx="220" cy="940" r="2.8" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="380" cy="890" r="2.0" fill="#B8C0D8" opacity="0.22"/>
              <circle cx="1560" cy="910" r="2.6" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1710" cy="860" r="3.2" fill="#B8C0D8" opacity="0.32"/>
              <circle cx="1840" cy="960" r="2.4" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="120" cy="460" r="2.0" fill="#B8C0D8" opacity="0.20"/>
              <circle cx="1810" cy="620" r="2.5" fill="#B8C0D8" opacity="0.22"/>

            <!-- Distant timber yard stack silhouettes at bottom edges -->
            <rect x="0" y="940" width="360" height="140" fill="#050814" opacity="0.55"/>

              <circle cx="1780" cy="760" r="3.4" fill="#B8C0D8" opacity="0.28"/>

            <!-- Vertical wooden post structural guides on left & right margins -->
            <rect x="40" y="80" width="32" height="920" fill="#0A0E24" opacity="0.65"/>
            <rect x="1848" y="80" width="32" height="920" fill="#0A0E24" opacity="0.65"/>
            <line x1="72" y1="80" x2="72" y2="1000" stroke="#151B3B" stroke-width="4" opacity="0.35"/>

          </g>
        </svg>
      </div>

      <!-- Near plane: foreground timber beams, wire ties & close ember flakes -->
      <div class="wbg-plane p-near">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="w01-emberFleck" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.55"/>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="../assets/brand/lib/motion.js"></script>
  <script src="../assets/brand-lib/motion.js"></script>
  <script>
    (function initWbg01() {
      var ID = 'wbg-01-yard-night';
      var SLOT = 60.0;
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!root || !window.gsap) return;
      var nz = (window.RLMotion && window.RLMotion.noise1) ? window.RLMotion.noise1(71001) : function(t) { return Math.sin(t); };
      var tl = gsap.timeline({ paused: true });
      var drift = { p: 0 };

      /* 3 distinct drift rates on 3 depth planes */
      tl.to('#w01-far-drift', { x: -180, duration: SLOT, ease: 'none' }, 0);
      tl.to('#w01-mid-drift', { x: -120, duration: SLOT, ease: 'none' }, 0);
      tl.to('#w01-near-drift', { x: -60, duration: SLOT, ease: 'none' }, 0);

      /* Seeded continuous micro-drift across slot */
      tl.to(drift, {
        p: 1, duration: SLOT, ease: 'none',
        onUpdate: function () {
          var t = tl.time();
          gsap.set('#w01-far-particles', { x: nz(t * 0.055) * 8, y: nz(t * 0.045 + 2) * 6 });
          gsap.set('#w01-mid-particles', { x: nz(t * 0.075 + 4) * 11, y: nz(t * 0.065 + 6) * 8 });
          gsap.set('#w01-near-particles', { x: nz(t * 0.095 + 8) * 14, y: nz(t * 0.085 + 10) * 10 });
        }
      }, 0);

      /* Living hold: gentle breathing on perimeter lamp glow */
      tl.to('#w01-perimeter-lamps', {
        scale: 1.03, duration: 15, yoyo: true, repeat: 3, ease: 'sine.inOut',
        transformOrigin: '84% 20%'
      }, 0);

      tl.to('#w01-mid-drift', {
        opacity: 0.80, duration: 7.5, yoyo: true, repeat: 7, ease: 'sine.inOut'
      }, 0);

      /* Slot guard */
      tl.to({}, { duration: SLOT }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
