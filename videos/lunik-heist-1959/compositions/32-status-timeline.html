      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }
    #root::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      background: radial-gradient(circle at 50% 50%, rgba(142, 95, 217, 0.08), transparent 75%);
    }
    .scene-persp {
      position: absolute;
      inset: 0;
      perspective: 1800px;
      perspective-origin: 50% 50%;
    }
    #s32-world, #s32-mg, #s32-mg-drift {
      transform-style: preserve-3d;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ================= INITIAL STATE ================= */
      gsap.set("#s32-rail-active", { strokeDashoffset: 1560 });
      gsap.set("#s32-arc-rail", { strokeDashoffset: 1600 });
      gsap.set("#s32-badge", { scale: 0.7, opacity: 0, transformOrigin: "0% 0%" });
      gsap.set("#s32-node-1", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s32-node-2", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s32-node-3", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s32-node-4", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s32-film-reel", { scale: 0, rotation: -90, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s32-lock-station", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s32-lock-shackle", { y: -36, rotation: -16, transformOrigin: "30px -10px" });

      /* ================= PHASE 1: RAIL DRAW & BADGE (0.0 - 2.5s) ================= */
      // 0.0s SFX riser cue: timeline rail draws across screen
      tl.to("#s32-rail-active", { strokeDashoffset: 1100, duration: 1.8, ease: "power2.out" }, 0.0);
      tl.to("#s32-badge", { scale: 1.0, opacity: 1, duration: 0.8, ease: "back.out(1.4)" }, 0.3);

      // Node 1 (1959) stamps down at 1.4s (VO: "nineteen fifty-nine" at 470.1)
      tl.to("#s32-node-1", { scale: 1.0, opacity: 1, duration: 0.65, ease: "back.out(1.5)" }, 1.35);

      /* ================= PHASE 2: SEQUENCE OF DATE NODES (2.5 - 10.5s) ================= */
      // Rail advances toward Node 2
      tl.to("#s32-rail-active", { strokeDashoffset: 750, duration: 2.2, ease: "power1.inOut" }, 1.8);

      // Node 2 (1995) stamps down at 4.2s (VO: "nineteen ninety-five" at 473.68)
      tl.to("#s32-node-2", { scale: 1.0, opacity: 1, duration: 0.65, ease: "back.out(1.5)" }, 4.15);

      // Rail advances toward Node 3
      tl.to("#s32-rail-active", { strokeDashoffset: 400, duration: 2.5, ease: "power1.inOut" }, 4.8);

      // Node 3 (2019) stamps down at 7.8s (VO: "twenty nineteen" at 478.28)
      tl.to("#s32-node-3", { scale: 1.0, opacity: 1, duration: 0.65, ease: "back.out(1.5)" }, 7.75);

      /* ================= PHASE 3: 2024, FILM REEL & 65-YEAR ARC (10.5 - 14.5s) ================= */
      // Rail advances to Node 4 and Lock
      tl.to("#s32-rail-active", { strokeDashoffset: 0, duration: 2.6, ease: "power2.out" }, 8.5);

      // Node 4 (2024) stamps down at 11.1s (VO: "twenty twenty-four" at 480.08)
      tl.to("#s32-node-4", { scale: 1.0, opacity: 1, duration: 0.65, ease: "back.out(1.5)" }, 11.05);

      // Film reel seats at 2024 (VO: "a feature film was announced" at 481.3)
      tl.to("#s32-film-reel", { scale: 1.0, rotation: 0, opacity: 1, duration: 0.8, ease: "back.out(1.4)" }, 11.6);
      tl.to("#s32-film-reel", { rotation: 180, duration: 4.8, ease: "none" }, 12.4);

      // 65-year arc fills beneath strip (11.2 - 14.2s)
      tl.to("#s32-arc-rail", { strokeDashoffset: 0, duration: 3.0, ease: "power2.inOut" }, 11.2);
      tl.to("#s32-arc-terminal", { opacity: 1, duration: 0.4, ease: "power2.out" }, 14.0);

      /* ================= PHASE 4: LOCK CAPSULE & CLIMAX (14.5 - 17.740s) ================= */
      // Lock capsule seats at 14.6s (VO: "Sixty-five years later, it is still not fully declassified")
      tl.to("#s32-lock-station", { scale: 1.0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 14.5);

      // Padlock shackle snaps shut with 4° recoil oscillation at 15.2s
      tl.to("#s32-lock-shackle", { y: 0, rotation: 0, duration: 0.28, ease: "power3.in" }, 15.15);
      tl.to("#s32-lock-station", { rotation: 4, duration: 0.08, yoyo: true, repeat: 3, ease: "sine.inOut" }, 15.43);
      tl.to("#s32-lock-bloom", { opacity: 0.85, scale: 1.3, duration: 0.35, ease: "power2.out" }, 15.43);
      tl.to("#s32-lock-bloom", { opacity: 0.35, scale: 1.1, duration: 0.6, ease: "power2.inOut" }, 15.78);

      /* ================= LIVING HOLDS & AMBIENT DRIFT ================= */
      tl.to("#s32-pill-1", { y: -4, duration: 0.7, yoyo: true, repeat: 2, ease: "sine.inOut" }, 3.0);
      tl.to("#s32-pill-2", { y: -4, duration: 0.7, yoyo: true, repeat: 2, ease: "sine.inOut" }, 5.5);
      tl.to("#s32-pill-3", { y: -4, duration: 0.7, yoyo: true, repeat: 2, ease: "sine.inOut" }, 9.0);
      tl.to("#s32-pill-4", { y: -4, duration: 0.7, yoyo: true, repeat: 2, ease: "sine.inOut" }, 12.0);
      tl.to("#s32-lock-station", { y: -3, duration: 0.45, yoyo: true, repeat: 2, ease: "sine.inOut" }, 16.0);

      /* ================= CAMERA DOLLY & PARALLAX ================= */
      tl.fromTo("#s32-world", { x: 80, scale: 1.0 }, { x: -80, scale: 1.04, duration: 17.740, transformOrigin: "50% 50%", ease: "sine.inOut" }, 0.0);
      tl.fromTo("#s32-bg", { x: 30 }, { x: -30, duration: 17.740, ease: "sine.inOut" }, 0.0);
      tl.fromTo("#s32-mg-drift", { x: -20 }, { x: 20, duration: 17.740, ease: "sine.inOut" }, 0.0);
      tl.fromTo("#s32-fg", { x: 12 }, { x: -12, duration: 17.740, ease: "sine.inOut" }, 0.0);

      /* ================= SEAM: SWIFT TIMELINE-DATE-STRIP ================= */
      tl.to("#s32-exit-wipe", { opacity: 1, duration: 0.28, ease: "power2.in" }, 17.42);

      /* ================= UNIVERSAL TIMELINE SLOT GUARD ================= */
      tl.to({}, { duration: 17.740 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["32-status-timeline"] = tl;
    })();
  </script>
</div>
</template>
