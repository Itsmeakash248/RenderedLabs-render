      #label{font-family:'Quicksand',sans-serif;}
      #plateImg{opacity:1;}
      /* CSS 3D isometric 3/4 view on the crate wrapper; offset+scale keep the
         crate clear of the 58% plate panel on the right */

           transform:translate(-230px, 30px) scale(0.88) rotateX(12deg) rotateZ(-18deg);}

      #ticksX path,#ticksY path,#ticksZ path,#seamsLeft path,#seamsRight path,#topCleats path{
        transform-box:fill-box;transform-origin:center;}
    </style>

        gsap.set("#ruler",             {opacity:1});
        gsap.set("#axisXLine,#axisYLine,#axisZLine", {strokeDasharray:640, strokeDashoffset:640});
        gsap.set("#ticksX path,#ticksY path,#ticksZ path", {opacity:0, scaleY:0.3, transformOrigin:"center"});
        gsap.set("#plateCardBg",       {opacity:0, x:60});
        gsap.set("#plateImg",          {opacity:0, scale:1.045, transformOrigin:"1339px 540px"});
        gsap.set("#sheen",             {x:0, opacity:0});
        gsap.set("#bracketWrap",       {opacity:0});
        gsap.set("#bracketSweep",      {strokeDasharray:"0 4000"});

        tl.to("#crewA", {opacity:1, y:0, duration:0.46, ease:"back.out(2.2)"}, 2.06);

        /* 7. ruler snaps into place pulse */
        tl.to("#ruler", {scale:1.012, duration:0.14, transformOrigin:"640px 580px", ease:"power2.out"}, 4.34);

        tl.to("#plateCardBg", {opacity:1, x:0, duration:0.78, ease:"expo.out"}, 0.42);

        tl.to("#cardSheen",   {opacity:0.04, duration:0.90, ease:"power1.out"}, 0.95);

        /* 10. sheen sweep across plate */
        tl.fromTo("#sheen", {x:0, opacity:0}, {x:1500, opacity:0.10, duration:1.10, ease:"power1.inOut"}, 1.95);
        tl.to("#sheen", {opacity:0, duration:0.30}, 3.02);

        /* 11. bracket sweep over quote region as ruler lands */
        tl.to("#bracketWrap", {opacity:1, duration:0.20}, 4.30);
        tl.to("#bracketSweep", {strokeDasharray:"1206 4000", duration:0.66, ease:"power2.inOut"}, 4.40);

        tl.to("#bracketGlow", {opacity:0.18, duration:0.36, ease:"power2.out"}, 4.90);
        tl.to("#bracketGlow", {opacity:0.06, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:3}, 5.30);

        /* 12. camera orbit +8deg and push 1.00 -> 1.04 (crate wrapper carries the CSS rotateX/rotateZ) */

        /* 13. parallax on three layers */

        /* dust: slow seeded drift, fixed constants, parallax-scaled */
        var dustCfg = [
          {sel:"#dust-bg circle", dx:38, dy:-26, dur:7.4, rot:5,  start:0.2},
          {sel:"#dust-mg circle", dx:64, dy:-34, dur:6.2, rot:8,  start:0.9},
          {sel:"#dust-fg circle", dx:104,dy:-52, dur:5.6, rot:12, start:0.0}
        ];
        for (var d=0; d<dustCfg.length; d++){
          var c = dustCfg[d];
          var nodes = document.querySelectorAll(c.sel);
          for (var i=0;i<nodes.length;i++){
            var dir = (i % 2 === 0) ? 1 : -1;
            var k = 1 + (i % 3) * 0.18;
            tl.to(nodes[i], {
              x: c.dx * dir * k * 0.45,
              y: c.dy * k,
              opacity: 0.34 + ((i + d) % 4) * 0.11,
              duration: c.dur * (0.82 + (i % 5) * 0.06),
              ease:"sine.inOut", yoyo:true, repeat:2
            }, c.start + i * 0.21);
          }
        }

        tl.to("#crateWrap", {y:-8, duration:2.9, ease:"sine.inOut", yoyo:true, repeat:2}, 0.8);

        /* late craft shimmer (t > 6 s) */
