      pointer-events: none;
      z-index: 30;
      background: radial-gradient(circle at 50% 50%, rgba(142, 95, 217, 0.08), transparent 75%);
    }
    .scene-persp {
      position: absolute;
      inset: 0;
      perspective: 1800px;
      perspective-origin: 50% 50%;

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ================= INITIAL STATE ================= */
      gsap.set("#s33-badge", { scale: 0.7, opacity: 0, transformOrigin: "0% 0%" });
      gsap.set("#s33-ghosts-container", { opacity: 0.95 });
      gsap.set("#s33-page-assembly", { scale: 0.6, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#s33-page-3d", { rotationX: 18, rotationY: -8 });

      // Bars start at width 0
      gsap.set(".s33-bar", { attr: { width: 0 } });
      gsap.set("#s33-hilo-1, #s33-hilo-line-1, #s33-hilo-glow-1", { attr: { width: 0 } });
      gsap.set("#s33-hilo-2, #s33-hilo-line-2, #s33-hilo-glow-2", { attr: { width: 0 } });

      /* ================= PHASE 1: YARD GHOSTS (0.0 - 4.5s) ================= */
      // 0.0s SFX chime hit: Badge enters and ghosts are visible
      tl.to("#s33-badge", { scale: 1.0, opacity: 1, duration: 0.8, ease: "back.out(1.4)" }, 0.2);
      tl.to("#s33-ghost-crate", { scale: 1.03, duration: 2.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.5);
      tl.to("#s33-ghost-roof", { y: -4, duration: 1.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.8);
      tl.to("#s33-ghost-canvas", { scaleY: 1.06, duration: 1.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.0);
      tl.to("#s33-ghost-fence", { y: -3, duration: 1.8, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.6);

      /* ================= PHASE 2: GHOSTS COLLAPSE (4.5 - 6.8s) ================= */
      // At "What survives is a document" (VO at 492.42 rel 5.78s):
      // Ghosts collapse along bezier paths toward page center
      tl.to("#s33-ghost-fence", { scale: 0.2, opacity: 0, duration: 1.6, ease: "power2.in" }, 4.6);
      tl.to("#s33-ghost-roof", { y: 220, scale: 0.2, opacity: 0, duration: 1.5, ease: "power2.in" }, 4.9);
      tl.to("#s33-ghost-crate", { scale: 0.15, opacity: 0, duration: 1.8, ease: "power2.in" }, 5.2);
      // Canvas fold collapses last
      tl.to("#s33-ghost-canvas", { scale: 0.1, opacity: 0, duration: 1.4, ease: "power2.in" }, 5.6);

      /* ================= PHASE 3: PAGE BLOOMS & BLACKOUT LINES INK (6.5 - 10.0s) ================= */
      // Document page blooms to full opacity and settles on 12° perspective
      tl.to("#s33-page-assembly", { scale: 1.0, opacity: 1, duration: 1.6, ease: "back.out(1.2)" }, 6.4);
      tl.to("#s33-page-3d", { rotationX: 12, rotationY: -4, duration: 1.8, ease: "power2.out" }, 6.6);
      tl.to("#s33-warm-glow", { opacity: 0.65, duration: 2.0, ease: "power2.out" }, 6.8);

      // Glass specular sheen sweeps across the card
      tl.to("#s33-glass-sheen", { opacity: 0.65, duration: 0.3, ease: "power1.out" }, 7.0);
      tl.to("#s33-glass-sheen", { x: 740, duration: 1.2, ease: "power2.inOut" }, 7.1);
      tl.to("#s33-glass-sheen", { opacity: 0, duration: 0.4, ease: "power1.in" }, 8.1);

      // Redaction lines ink across paragraphs in sequence
      const barWidths = [890, 850, 920, 870, 830, 880, 910, 860, 890, 840];
      const bars = [
        "#s33-redactions rect:nth-child(1)",
        "#s33-redactions rect:nth-child(2)",
        "#s33-redactions rect:nth-child(3)",
        "#s33-redactions rect:nth-child(4)",
        "#s33-redactions rect:nth-child(5)",
        "#s33-redactions rect:nth-child(6)",
        "#s33-redactions rect:nth-child(7)",
        "#s33-redactions rect:nth-child(8)",
        "#s33-redactions rect:nth-child(9)",
        "#s33-redactions rect:nth-child(10)"
      ];

      bars.forEach(function (sel, idx) {
        tl.to(sel, { attr: { width: barWidths[idx] }, duration: 0.35, ease: "power1.inOut" }, 7.8 + idx * 0.18);
      });

      /* ================= PHASE 4: SURVIVING CLAIM HIGHLIGHT (10.0 - 15.5s) ================= */
      // Quote 1: "twice gained extended access to the Lunik" (VO at 496.42 rel 9.78s - 10.2s)
