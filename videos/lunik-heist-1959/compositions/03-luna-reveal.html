<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({paused: true});

  var DURATION = 24.72;
  gsap.set("#s03-rocket-wrap", {transformOrigin: "50% 62%"});

  /* ---- Phase A: dolly through the crate mouth (0 -> 5.2) ---- */
  tl.fromTo("#stage", {scale: 1.35, transformOrigin: "50% 58%"}, {scale: 1.00, duration: 5.2, ease: "power2.out"}, 0);

  /* ---- Phase B: panels peel outward along joints (1.2 -> 6.4) ---- */
  tl.to("#s03-panel-l", {rotationY: -26, x: -150, y: -30, scaleX: 0.55, transformOrigin: "100% 50%", duration: 3.4, ease: "power3.inOut"}, 1.4);
  tl.to("#s03-panel-r", {rotationY: 26, x: 150, y: -30, scaleX: 0.55, transformOrigin: "0% 50%", duration: 3.4, ease: "power3.inOut"}, 1.6);
  tl.to("#s03-panel-t", {rotationX: 26, y: -180, scaleY: 0.6, transformOrigin: "50% 100%", duration: 3.0, ease: "power3.inOut"}, 2.0);
  tl.to("#s03-panel-b", {rotationX: -22, y: 150, scaleY: 0.6, transformOrigin: "50% 0%", duration: 3.0, ease: "power3.inOut"}, 2.2);

  /* depth wander for the peeled panels — parallax 1.0 (near) */
  tl.to("#s03-panel-l", {y: "-=26", duration: 2.6, ease: "sine.inOut"}, 5.0);
  tl.to("#s03-panel-r", {y: "-=20", duration: 2.4, ease: "sine.inOut"}, 5.2);

  /* ---- Phase C: Luna stage extrudes from the base upward (3.2 -> 9.0) ---- */
  tl.fromTo("#s03-rocket-wrap", {y: 340, opacity: 0.35, scaleY: 0.62, transformOrigin: "50% 100%"},
                                {y: 0, opacity: 1, scaleY: 1, duration: 4.6, ease: "power3.out"}, 3.2);

  /* hull then nose, staggered to read as extrusion */
  tl.fromTo("#s03-hull", {y: 120, opacity: 0}, {y: 0, opacity: 1, duration: 3.2, ease: "power2.out"}, 3.2);
  tl.fromTo("#s03-nose", {y: 160, opacity: 0, scaleY: 0.4, transformOrigin: "50% 100%"},
                          {y: 0, opacity: 1, scaleY: 1, duration: 2.8, ease: "power2.out"}, 4.4);
  tl.fromTo("#s03-fins", {y: 80, opacity: 0}, {y: 0, opacity: 1, duration: 2.2, ease: "power2.out"}, 4.0);

  /* windows ignite — gold radial glow bloom, no pop-in */
  tl.fromTo("#s03-win-1", {opacity: 0, scale: 0.4, transformOrigin: "50% 50%"}, {opacity: 1, scale: 1, duration: 1.5, ease: "power2.out"}, 5.6);
  tl.fromTo("#s03-win-2", {opacity: 0, scale: 0.4, transformOrigin: "50% 50%"}, {opacity: 1, scale: 1, duration: 1.5, ease: "power2.out"}, 6.1);
  tl.fromTo("#s03-win-3", {opacity: 0, scale: 0.4, transformOrigin: "50% 50%"}, {opacity: 1, scale: 1, duration: 1.5, ease: "power2.out"}, 6.6);
  tl.fromTo("#s03-win-1-core", {opacity: 0, scale: 0.5, transformOrigin: "50% 50%"}, {opacity: 1, scale: 1, duration: 1.1, ease: "back.out(1.4)"}, 5.8);
  tl.fromTo("#s03-win-2-core", {opacity: 0, scale: 0.5, transformOrigin: "50% 50%"}, {opacity: 1, scale: 1, duration: 1.1, ease: "back.out(1.4)"}, 6.3);
  tl.fromTo("#s03-win-3-core", {opacity: 0, scale: 0.5, transformOrigin: "50% 50%"}, {opacity: 1, scale: 1, duration: 1.1, ease: "back.out(1.4)"}, 6.8);

  /* gold window pulse — keeps nothing static */
  tl.to("#s03-win-1", {opacity: 0.72, duration: 1.6, yoyo: true, repeat: 3, ease: "sine.inOut"}, 7.8);
  tl.to("#s03-win-2", {opacity: 0.76, duration: 1.5, yoyo: true, repeat: 3, ease: "sine.inOut"}, 8.1);
  tl.to("#s03-win-3", {opacity: 0.70, duration: 1.7, yoyo: true, repeat: 3, ease: "sine.inOut"}, 8.4);

  /* engine void stays deliberately empty — a slow breathing shadow only */
