  <style>
    #root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:transparent;}

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({paused:true});

      /* ---- establish · push in 1.00 -> 1.045 ---- */
      gsap.set("#stage", {transformOrigin:"50% 52%"});
      gsap.set("#pageTilt", {transformOrigin:"50% 50%", rotate:0});
      gsap.set("#glassCard", {transformOrigin:"50% 50%"});
      gsap.set("#fg-thread", {transformOrigin:"50% 60%"});
      gsap.set("#bg-shelves", {transformOrigin:"80% 40%"});
      gsap.set("#bg-desk", {transformOrigin:"40% 20%"});
      gsap.set("#plateGroup", {transformOrigin:"50% 50%"});
      gsap.set("#hiloOne", {scaleX:0, transformOrigin:"0% 50%"});
      gsap.set("#hiloTwo", {scaleX:0, transformOrigin:"0% 50%"});
      gsap.set(".redaction", {scaleX:0, transformOrigin:"0% 50%"});
      gsap.set("#pill1967", {opacity:0, scale:0.55, y:26});
      gsap.set("#pill1995", {opacity:0, scale:0.55, y:26});
      gsap.set(".bead", {opacity:0, scale:0.4});
      gsap.set("#crate", {opacity:0, scale:0.94});
      gsap.set("#sunArc", {opacity:0});
      gsap.set("#sunCore", {opacity:0});
      gsap.set("#threadGlow", {opacity:0.15});

      /* thread draw length */
      var thread = document.getElementById("threadPath");
      var threadLen = thread.getTotalLength();
      gsap.set("#threadPath", {strokeDasharray:threadLen, strokeDashoffset:threadLen});
      var glow = document.getElementById("threadGlow");
      var glowLen = glow.getTotalLength();
      gsap.set("#threadGlow", {strokeDasharray:glowLen, strokeDashoffset:glowLen, opacity:0.34});

      var arc = document.getElementById("sunArc");
      var arcLen = arc.getTotalLength();
      gsap.set("#sunArc", {strokeDasharray:arcLen, strokeDashoffset:arcLen});

      /* ---- camera: push + 14deg perspective tilt unwinding to square ---- */
      tl.fromTo("#stage", {scale:1.0}, {scale:1.045, duration:23.18, ease:"none"}, 0);
      tl.fromTo("#pageTilt", {rotate:-2.5, y:0}, {rotate:0, duration:9.5, ease:"power2.inOut"}, 0);
      tl.fromTo("#pageTilt", {rotationX:14, rotationY:-9, transformPerspective:2200},
        {rotationX:14, rotationY:-9, duration:23.18, ease:"none"}, 0);

      /* coupled drift: mg 0.6, bg 0.25, fg 1.0 */
      tl.fromTo("#mg-page", {x:-16, y:6}, {x:10, y:-4, duration:23.18, ease:"sine.inOut"}, 0);
      tl.fromTo("#fg-thread", {x:-26, y:10}, {x:26, y:-10, duration:23.18, ease:"sine.inOut"}, 0);
      tl.fromTo("#bg-shelves", {x:-7, y:3}, {x:7, y:-3, duration:23.18, ease:"sine.inOut"}, 0);
      tl.fromTo("#bg-desk", {x:-3, y:1}, {x:3, y:-1, duration:23.18, ease:"sine.inOut"}, 0);

      /* ---- 0.5s desk & page presence ---- */
      tl.fromTo("#glassCard", {opacity:0, scale:0.985}, {opacity:1, scale:1, duration:1.4, ease:"power2.out"}, 0.45);
      tl.fromTo("#plateGroup", {opacity:0}, {opacity:1, duration:1.2, ease:"power1.out"}, 0.7);

      /* ---- 2.1s thread seeds and draws across ---- */
      tl.to("#threadGlow", {strokeDashoffset:0, duration:5.2, ease:"power1.inOut"}, 2.1);
      tl.to("#threadPath", {strokeDashoffset:0, duration:5.2, ease:"power1.inOut"}, 2.1);

      /* ---- beads bloom as the thread passes ---- */
      tl.to("#bead1", {opacity:1, scale:1, duration:0.62, ease:"back.out(2.4)"}, 3.15);
      tl.to("#bead2", {opacity:1, scale:1, duration:0.62, ease:"back.out(2.4)"}, 4.05);
      tl.to("#bead3", {opacity:1, scale:1, duration:0.62, ease:"back.out(2.4)"}, 5.0);
      tl.to("#bead4", {opacity:1, scale:1, duration:0.62, ease:"back.out(2.4)"}, 5.95);

      /* ---- gold highlighter sweep, timed with thread arrival at the page ---- */
      tl.to("#hiloOne", {scaleX:1, duration:0.92, ease:"power2.inOut"}, 6.35);
      tl.to("#hiloTwo", {scaleX:1, duration:0.86, ease:"power2.inOut"}, 6.75);

      /* ---- date pills socket on with spring overshoot ---- */
      tl.to("#pill1967", {opacity:1, scale:1, y:0, duration:1.05, ease:"elastic.out(1,0.45)"}, 7.4);
      tl.to("#pill1995", {opacity:1, scale:1, y:0, duration:1.15, ease:"elastic.out(1,0.42)"}, 9.2);

      /* ---- redaction bars ink across two paragraphs ---- */
      tl.to(".redaction", {
        scaleX:1, duration:0.55, ease:"power3.inOut", stagger:{each:0.13, from:"start"}
      }, 10.6);

      /* ---- thread loops into the crate outline ---- */
      tl.to("#crate", {opacity:1, scale:1, duration:1.1, ease:"back.out(1.5)"}, 13.1);

      /* ---- thin sunrise arc crosses the bottom ---- */
      tl.to("#sunArc", {opacity:1, duration:0.4, ease:"none"}, 15.2);
      tl.to("#sunArc", {strokeDashoffset:0, duration:4.4, ease:"sine.inOut"}, 15.2);
      tl.to("#sunCore", {opacity:0.11, duration:2.2, ease:"sine.out"}, 16.4);
      tl.to("#sunCore", {opacity:0.06, duration:3.2, ease:"sine.inOut"}, 19.0);

      /* ---- page settles square to camera ---- */
      tl.to("#pageTilt", {rotationX:14, rotationY:0, rotate:0, duration:3.4, ease:"power2.inOut"}, 19.2);
      tl.to("#mg-page", {x:0, y:0, duration:3.2, ease:"power2.inOut"}, 19.4);

      /* ---- ambient dust, nothing static > 2s ---- */
      var motes = gsap.utils.toArray(".mote");
      motes.forEach(function (m, i) {
        var ph = i * 0.37;
        tl.to(m, {
          y: "-=26", x: "+=" + (i % 2 === 0 ? 12 : -12),
          duration: 3.2 + (i % 4) * 0.4, ease: "sine.inOut", yoyo: true, repeat: 6
        }, ph);
        tl.to(m, {opacity: 0.06, duration: 1.8 + (i % 3) * 0.3, ease:"sine.inOut", yoyo:true, repeat:11}, ph + 0.6);
      });

      /* ---- lamp breath ---- */
      tl.to("#bg-desk ellipse:first-of-type", {opacity:0.82, duration:4.6, ease:"sine.inOut", yoyo:true, repeat:4}, 0.2);

      /* ---- late craft shimmer (t > 18 s) ---- */
      tl.to("#threadPath", {strokeWidth:12, duration:1.6, yoyo:true, repeat:2, ease:"sine.inOut"}, 18.4);
      tl.to("#dust", {y:-14, duration:3.0, yoyo:true, repeat:1, ease:"sine.inOut"}, 18.6);
      tl.to("#pill1967 rect, #pill1995 rect", {strokeOpacity:1, duration:1.4, yoyo:true, repeat:2, stagger:0.2, ease:"sine.inOut"}, 18.8);

      /* ---- tail settle ---- */
      tl.to("#fg-thread", {opacity:0.96, duration:2.4, ease:"sine.inOut"}, 20.6);

      tl.to({}, {duration: 23.18}, 0);
      window.__timelines["04-archive-page"] = tl;
    })();
  </script>
</template>
