      var tl = gsap.timeline({ paused: true });

      /* ---------- initial states ---------- */
      gsap.set("#s22-lamp-l", { opacity: 0, y: -34 });

      gsap.set("#s22-thread ellipse", { opacity: 0, scaleX: 0.2, transformOrigin: "50% 50%" });
      gsap.set("#s22-hour", { strokeDashoffset: 2702, opacity: 0.3 });
      gsap.set("#s22-hour-ticks", { opacity: 0 });
      gsap.set("#s22-baffle", { y: -940 });
      gsap.set("#s22-crew-l", { opacity: 0, x: -150 });
      gsap.set("#s22-crew-r", { opacity: 0, x: 150 });
      gsap.set("#s22-hand-l", { opacity: 0, y: 34 });
      gsap.set("#s22-hand-r", { opacity: 0, y: 34 });
      gsap.set("#s22-cone-l", { opacity: 0, scaleX: 0.3, svgOrigin: "330 468" });
      gsap.set("#s22-cone-r", { opacity: 0, scaleX: 0.3, svgOrigin: "1590 468" });
      gsap.set("#s22-impact-l", { opacity: 0 });
      gsap.set("#s22-impact-r", { opacity: 0 });
      gsap.set("#s22-dust circle", { opacity: 0 });
      gsap.set("#s22-exit", { x: 2400 });
      gsap.set("#s22-badge", { opacity: 0, scale: 1.4, rotation: -4, transformOrigin: "50% 50%" });

      /* ---------- phase 1: rod and thread spiral extrude ---------- */
      tl.to("#s22-lamp-l", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.1);
      tl.to("#s22-lamp-r", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.24);
      tl.to("#s22-bg-dust circle", { opacity: 0.15, duration: 0.7, stagger: 0.09, ease: "power1.out" }, 0.5);
      tl.to("#s22-rod", { scaleX: 1, duration: 1.55, ease: "power3.out" }, 0.4);
      tl.to("#s22-thread ellipse", { opacity: 0.95, scaleX: 1, duration: 0.4, stagger: 0.035, ease: "back.out(2)" }, 1.0);
      tl.to("#s22-hour-ticks", { opacity: 0.4, duration: 0.5, ease: "power1.out" }, 1.1);
      tl.to("#s22-hour", { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.2);

      /* ---------- phase 2: baffle plate slides in and occludes the centre ---------- */
      tl.to("#s22-baffle", { y: 0, duration: 1.65, ease: "power3.inOut" }, 2.3);
      tl.to("#s22-baffle", { y: -6, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, 4.0);
      tl.to("#s22-impact-l", { opacity: 0.9, duration: 0.18, ease: "power2.out" }, 3.98);
      tl.to("#s22-impact-l", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.2);
      tl.to("#s22-impact-r", { opacity: 0.9, duration: 0.18, ease: "power2.out" }, 4.02);
      tl.to("#s22-impact-r", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.24);

      /* ---------- phase 3: two crew beads enter from opposite ends ---------- */
      tl.to("#s22-crew-l", { opacity: 1, x: 0, duration: 1.1, ease: "power3.out" }, 4.55);
