  #root::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function(){
  var tl = gsap.timeline({paused:true});
  var NS = "http://www.w3.org/2000/svg";
  var qs = function(id){ return document.getElementById(id); };

  /* deterministic pseudo-random */
  function lcg(seed){ var s = seed; return function(){ s = (s*1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }
  var rnd = lcg(19591);

  /* --- crowd beads: two depths, streamed past the crate --- */
  var nearG = qs("s06-crowd-near");
  var farG = qs("s06-crowd-far");

  function makeBeads(g, count, yMin, yMax, radMin, radMax, startX){
    var arr = [];
    for (var i=0;i<count;i++){
      var c = document.createElementNS(NS,"circle");
      var r = radMin + rnd()*(radMax-radMin);
      var y = yMin + rnd()*(yMax-yMin);
      c.setAttribute("cx", startX + rnd()*600);
      c.setAttribute("cy", y);
      c.setAttribute("r", r);
      g.appendChild(c);
      arr.push({el:c, dur: 3.2 + rnd()*2.0, delay: -rnd()*6, travel: 1500 + rnd()*700, wob: 12 + rnd()*26, phase: rnd()*Math.PI*2});
    }
    return arr;
  }

  var near = makeBeads(nearG, 12, 800, 900, 12, 22, -240);
  var far  = makeBeads(farG, 20, 742, 796, 6, 12, -240);

  function streamBeads(arr, yBase){
    arr.forEach(function(b){
      tl.fromTo(b.el, {x: -b.travel}, {
        x: b.travel,
        duration: b.dur,
        ease: "none",
        repeat: 1,
        yoyo: false
      }, (b.phase % 1) * 0.6);
    });
  }
  streamBeads(near, 850);
  streamBeads(far, 770);

  /* --- reveal order --- */
  // hall wash breathe
  tl.fromTo(qs("s06-hallwash"), {opacity:0, scaleX:0.9}, {opacity:0.16, scaleX:1.06, duration:4.2, ease:"sine.inOut", transformOrigin:"50% 50%"}, 0);
  tl.to(qs("s06-hallwash"), {opacity:0.09, duration:3.4, ease:"sine.inOut"}, 4.2);

  // wall seams settle
  tl.fromTo(qs("s06-wall-seams"), {opacity:0}, {opacity:1, duration:1.6, ease:"power2.out"}, 0.15);

  // plate glass card slides in behind
  tl.fromTo(qs("s06-plate-card"),
    {opacity:0, y:46, scale:0.965, transformOrigin:"1365px 538px"},
    {opacity:1, y:0, scale:1, duration:2.0, ease:"power3.out"}, 0.35);

  // floor pool
  tl.to(qs("s06-floorpool"), {opacity:1, duration:1.4, ease:"power2.out"}, 0.9);
  tl.fromTo(qs("s06-floorpool"), {scaleX:0.82}, {scaleX:1.04, duration:2.4, ease:"sine.inOut", transformOrigin:"700px 866px", repeat:3, yoyo:true}, 0);

  // crate side + front
  tl.fromTo(qs("s06-crate-side-g"), {opacity:0, x:-30}, {opacity:1, x:0, duration:1.3, ease:"power3.out"}, 1.0);
  tl.fromTo(qs("s06-crate-front-g"), {opacity:0, scaleY:0.86, transformOrigin:"755px 760px"}, {opacity:1, scaleY:1, duration:1.5, ease:"power3.out"}, 1.25);

  // panels grow: roof posts, cap, ridge, legs, plinth
  tl.fromTo(qs("s06-beam-1"), {scaleY:0, transformOrigin:"330px 340px"}, {scaleY:1, duration:0.7, ease:"back.out(2.2)"}, 2.05);
  tl.fromTo(qs("s06-beam-2"), {scaleY:0, transformOrigin:"1180px 340px"}, {scaleY:1, duration:0.7, ease:"back.out(2.2)"}, 2.22);
  tl.fromTo(qs("s06-roof-cap"), {opacity:0, y:-26}, {opacity:1, y:0, duration:0.85, ease:"power3.out"}, 2.5);
  tl.fromTo(qs("s06-roof-ridge"), {scaleX:0, transformOrigin:"755px 286px"}, {scaleX:1, duration:1.0, ease:"power2.inOut"}, 2.8);
  tl.fromTo(qs("s06-crate-legs"), {opacity:0}, {opacity:1, duration:0.6, ease:"power2.out"}, 2.7);
  tl.fromTo(qs("s06-plinth-g"), {opacity:0, y:24}, {opacity:1, y:0, duration:1.0, ease:"power3.out"}, 3.0);

  // three glowing inspection windows draw up from the sill, then bloom
  tl.fromTo(qs("s06-win-1"), {opacity:0, scaleY:0, transformOrigin:"500px 546px"}, {opacity:1, scaleY:1, duration:0.9, ease:"power2.out"}, 3.45);
  tl.fromTo(qs("s06-win-2"), {opacity:0, scaleY:0, transformOrigin:"755px 546px"}, {opacity:1, scaleY:1, duration:0.9, ease:"power2.out"}, 3.72);
  tl.fromTo(qs("s06-win-3"), {opacity:0, scaleY:0, transformOrigin:"1010px 546px"}, {opacity:1, scaleY:1, duration:0.9, ease:"power2.out"}, 3.99);
  tl.fromTo(document.querySelector("#s06-win-1 circle"), {opacity:0, scale:0.7, transformOrigin:"500px 470px"}, {opacity:1, scale:1, duration:1.2, ease:"power2.out"}, 3.45);
  tl.fromTo(document.querySelector("#s06-win-2 circle"), {opacity:0, scale:0.7, transformOrigin:"755px 470px"}, {opacity:1, scale:1, duration:1.2, ease:"power2.out"}, 3.72);
  tl.fromTo(document.querySelector("#s06-win-3 circle"), {opacity:0, scale:0.7, transformOrigin:"1010px 470px"}, {opacity:1, scale:1, duration:1.2, ease:"power2.out"}, 3.99);

  // window glow breathing loop
  [["s06-win-1","500px 470px"],["s06-win-2","755px 470px"],["s06-win-3","1010px 470px"]].forEach(function(w,i){
    tl.fromTo(qs(w[0]), {opacity:0.92}, {opacity:1, duration:0.9 + i*0.1, ease:"sine.inOut", repeat:3, yoyo:true, transformOrigin:w[1]}, 4.8 + i*0.3);
  });

  // label
  tl.fromTo(qs("s06-label"), {opacity:0, y:26}, {opacity:1, y:0, duration:1.1, ease:"power3.out"}, 4.55);

  // ember question mark draws itself
  var qStroke = qs("s06-q-stroke");
  var qLen = qStroke.getTotalLength();
  qStroke.style.strokeDasharray = qLen;
  qStroke.style.strokeDashoffset = qLen;
  tl.to(qStroke, {strokeDashoffset:0, duration:2.9, ease:"power2.inOut"}, 5.05);

  var qb = qs("s06-q-stroke-b");
  var qbLen = qb.getTotalLength();
  qb.style.strokeDasharray = qbLen;
  qb.style.strokeDashoffset = qbLen;
  tl.to(qb, {strokeDashoffset:0, duration:2.4, ease:"power2.inOut"}, 5.85);

  tl.fromTo(qs("s06-q-dot"), {opacity:0, scale:0.85, transformOrigin:"158px 908px"}, {opacity:1, scale:1, duration:0.7, ease:"power2.out"}, 7.55);

  // three parallax rates: bg hall wash, mg crate, fg crowd
  tl.fromTo(qs("s06-hallwash"), {x:-8}, {x:8, duration:11.18, ease:"sine.inOut"}, 0);
  tl.fromTo(qs("s06-crate"), {x:-14}, {x:14, duration:11.18, ease:"sine.inOut"}, 0);
  tl.fromTo(qs("s06-crowd-near"), {x:-24}, {x:24, duration:11.18, ease:"sine.inOut"}, 0);

  // late craft (t > 6 s): plate sheen, ember shimmer, crowd drift, motes
  tl.to(qs("s06-plate-sheen"), {opacity:0.9, duration:1.4, yoyo:true, repeat:2, ease:"sine.inOut"}, 6.2);
  tl.to(qs("s06-q-stroke-b"), {strokeWidth:30, duration:1.2, yoyo:true, repeat:2, ease:"sine.inOut"}, 6.5);
  tl.to(qs("s06-crowd-far"), {x:16, duration:2.2, yoyo:true, repeat:1, ease:"sine.inOut"}, 6.0);
