<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World 03 — Expo Hall</title>
</head>
<body>
<template id="wbg-03-template">
  <!-- World-BG w03 · Expo Hall · slot 120.0–180.0 s · hand-authored 2D parallax environment. -->
  <!-- Environment: Auditorio Nacional exhibition floor, banner ribs, crowd haze, amber exhibition floodlights. -->
  <style>
    #root { position: absolute; inset: 0; }
    [data-composition-id="wbg-03-expo-hall"] {
      position: absolute; inset: 0; overflow: hidden; background: transparent;
    }
    [data-composition-id="wbg-03-expo-hall"] .wbg-stage { position: absolute; inset: 0; overflow: hidden; }
    [data-composition-id="wbg-03-expo-hall"] .wbg-ground {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 56% 50% at 76% 20%, rgba(255,122,26,0.12) 0%, rgba(255,122,26,0.032) 42%, rgba(10,14,36,0) 72%),
        radial-gradient(ellipse 52% 46% at 24% 82%, rgba(142,95,217,0.11) 0%, rgba(10,14,36,0) 70%),
        linear-gradient(180deg, #070A12 0%, #0A0E24 24%, #151B3B 50%, #0A0E24 76%, #050814 100%),
        linear-gradient(90deg, #050814 0%, #0A0E24 16%, #0A0E24 84%, #050814 100%),
        linear-gradient(0deg, #050814 0%, rgba(5,8,20,0) 25%);
    }
    [data-composition-id="wbg-03-expo-hall"] .wbg-plane { position: absolute; inset: 0; }
    [data-composition-id="wbg-03-expo-hall"] .wbg-plane svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }
    [data-composition-id="wbg-03-expo-hall"] .p-glow { opacity: 0.90; }
    [data-composition-id="wbg-03-expo-hall"] .p-far { opacity: 0.72; }
    [data-composition-id="wbg-03-expo-hall"] .p-mid { opacity: 0.86; }
    [data-composition-id="wbg-03-expo-hall"] .p-near { opacity: 0.92; }
    [data-composition-id="wbg-03-expo-hall"] .wbg-scrim {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 46% 42% at 50% 50%, rgba(5,8,20,0.48) 0%, rgba(5,8,20,0.18) 58%, rgba(5,8,20,0) 100%),
        radial-gradient(ellipse 92% 88% at 50% 50%, rgba(5,8,20,0) 48%, rgba(5,8,20,0.60) 100%);
    }
    [data-composition-id="wbg-03-expo-hall"] .wbg-grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.28;
      background-image: radial-gradient(rgba(184,192,216,0.06) 0.6px, transparent 0.7px);
      background-size: 4px 4px;
    }
  </style>

  <div id="root" data-composition-id="wbg-03-expo-hall" data-width="1920" data-height="1080" data-duration="60">
    <div class="wbg-stage">
      <div class="wbg-ground"></div>

      <!-- Cavernous exhibition hall volume & high-bay floodlight glow -->
      <div class="wbg-plane p-glow">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="w03-hallFlood" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.32"/>
              <stop offset="30%" stop-color="#FF7A1A" stop-opacity="0.16"/>
              <stop offset="66%" stop-color="#8E5FD9" stop-opacity="0.06"/>
              <stop offset="100%" stop-color="#0A0E24" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="w03-highBayCore" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#F4EFE3" stop-opacity="0.60"/>
              <stop offset="38%" stop-color="#FFD23F" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="w03-crowdAtmosphere" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#8E5FD9" stop-opacity="0.22"/>
              <stop offset="52%" stop-color="#151B3B" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#0A0E24" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="w03-trussGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0A0E24" stop-opacity="0.80"/>
              <stop offset="50%" stop-color="#151B3B" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#0A0E24" stop-opacity="0.80"/>
            </linearGradient>
            <filter id="w03-blurHall" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="22"/>
            </filter>
          </defs>

          <!-- Deep volumetric shadows anchored at perimeter -->
          <g id="w03-deep-space">
            <ellipse cx="960" cy="1060" rx="700" ry="220" fill="#050814" opacity="0.42" filter="url(#w03-blurHall)"/>
            <ellipse cx="140" cy="160" rx="380" ry="240" fill="#0A0E24" opacity="0.36" filter="url(#w03-blurHall)"/>
            <ellipse cx="1820" cy="480" rx="320" ry="460" fill="#050814" opacity="0.36" filter="url(#w03-blurHall)"/>
            <ellipse cx="780" cy="-60" rx="540" ry="180" fill="#0A0E24" opacity="0.36" filter="url(#w03-blurHall)"/>
            <ellipse cx="80" cy="620" rx="280" ry="320" fill="#151B3B" opacity="0.28" filter="url(#w03-blurHall)"/>
            <ellipse cx="1860" cy="980" rx="380" ry="200" fill="#0A0E24" opacity="0.36" filter="url(#w03-blurHall)"/>
          </g>

          <!-- High-bay exhibition floodlights at upper right margin -->
          <g id="w03-flood-rig">
            <ellipse cx="1580" cy="220" rx="380" ry="270" fill="url(#w03-hallFlood)" opacity="0.62"/>
            <ellipse cx="1580" cy="220" rx="140" ry="96" fill="url(#w03-highBayCore)" opacity="0.65" filter="url(#w03-blurHall)"/>
            <circle cx="1575" cy="215" r="18" fill="#FFD23F" opacity="0.22"/>
            <!-- Lower left ambient crowd floor bounce -->
            <ellipse cx="320" cy="880" rx="400" ry="280" fill="url(#w03-crowdAtmosphere)" opacity="0.55"/>
          </g>

          <!-- Steel roof truss structure header (y <= 140) -->
          <g id="w03-roof-truss" opacity="0.45">
            <rect x="0" y="-10" width="1920" height="80" fill="#050814" opacity="0.85"/>
            <rect x="0" y="68" width="1920" height="22" fill="url(#w03-trussGrad)" opacity="0.60"/>
            <line x1="0" y1="90" x2="1920" y2="90" stroke="#151B3B" stroke-width="4" opacity="0.35"/>
            <!-- Structural truss vertical drops at lateral edges -->
            <rect x="70" y="60" width="180" height="48" fill="#0A0E24" opacity="0.70"/>
            <rect x="1670" y="60" width="180" height="48" fill="#0A0E24" opacity="0.70"/>
          </g>
        </svg>
      </div>

      <!-- Far plane: distant arena crowd haze particles & high rafters -->
      <div class="wbg-plane p-far">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g id="w03-far-drift">
            <g id="w03-far-haze">
              <!-- Edge dust & haze motes x < 480 or x > 1440 -->
              <circle cx="110" cy="150" r="2.2" fill="#B8C0D8" opacity="0.30"/>
              <circle cx="230" cy="260" r="2.5" fill="#B8C0D8" opacity="0.32"/>
              <circle cx="350" cy="180" r="2.0" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="450" cy="240" r="2.4" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1520" cy="160" r="2.2" fill="#B8C0D8" opacity="0.26"/>
              <circle cx="1650" cy="210" r="2.8" fill="#B8C0D8" opacity="0.32"/>
              <circle cx="1790" cy="140" r="2.2" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="90" cy="830" r="2.4" fill="#B8C0D8" opacity="0.24"/>
              <circle cx="250" cy="930" r="2.8" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1550" cy="900" r="2.6" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1730" cy="850" r="3.0" fill="#B8C0D8" opacity="0.32"/>
              <circle cx="1860" cy="950" r="2.4" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="130" cy="490" r="2.0" fill="#B8C0D8" opacity="0.20"/>
              <circle cx="1800" cy="550" r="2.4" fill="#B8C0D8" opacity="0.22"/>
            </g>
            <!-- Distant pavilion partition silhouettes at bottom edges -->
            <rect x="0" y="950" width="370" height="130" fill="#050814" opacity="0.65"/>
            <rect x="1550" y="950" width="370" height="130" fill="#050814" opacity="0.65"/>
            <line x1="0" y1="950" x2="370" y2="950" stroke="#151B3B" stroke-width="4" opacity="0.30"/>
            <line x1="1550" y1="950" x2="1920" y2="950" stroke="#151B3B" stroke-width="4" opacity="0.30"/>
          </g>
        </svg>
      </div>

      <!-- Mid plane: exhibition banner rib outlines and vertical structural columns -->
      <div class="wbg-plane p-mid">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g id="w03-mid-drift">
            <g id="w03-mid-haze">
              <circle cx="160" cy="230" r="3.0" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="290" cy="290" r="2.8" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="430" cy="230" r="3.2" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1490" cy="250" r="3.0" fill="#B8C0D8" opacity="0.26"/>
              <circle cx="1680" cy="280" r="3.4" fill="#B8C0D8" opacity="0.30"/>
              <circle cx="1820" cy="240" r="2.8" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="110" cy="760" r="2.6" fill="#B8C0D8" opacity="0.22"/>
              <circle cx="330" cy="840" r="3.0" fill="#B8C0D8" opacity="0.26"/>
              <circle cx="1610" cy="820" r="3.2" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1780" cy="770" r="3.0" fill="#B8C0D8" opacity="0.26"/>
            </g>
            <!-- Heavy structural columns framing auditorium perimeter -->
            <rect x="44" y="90" width="30" height="900" fill="#0A0E24" opacity="0.65"/>
            <rect x="1846" y="90" width="30" height="900" fill="#0A0E24" opacity="0.65"/>
            <line x1="74" y1="90" x2="74" y2="990" stroke="#151B3B" stroke-width="4" opacity="0.35"/>
            <line x1="1846" y1="90" x2="1846" y2="990" stroke="#151B3B" stroke-width="4" opacity="0.35"/>
          </g>
        </svg>
      </div>

      <!-- Near plane: foreground banner guide wires & warm spotlight motes -->
      <div class="wbg-plane p-near">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="w03-spotFleck" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.55"/>
              <stop offset="60%" stop-color="#FF7A1A" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#0A0E24" stop-opacity="0"/>
            </radialGradient>
            <filter id="w03-nearSpotBlur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
          </defs>
          <g id="w03-near-drift">
            <g id="w03-near-haze">
              <!-- Golden spotlight particles illuminated by high-bay beam -->
              <circle cx="1540" cy="270" r="4.2" fill="url(#w03-spotFleck)" opacity="0.45" filter="url(#w03-nearSpotBlur)"/>
              <circle cx="1670" cy="350" r="3.6" fill="url(#w03-spotFleck)" opacity="0.40"/>
              <circle cx="1620" cy="460" r="3.8" fill="url(#w03-spotFleck)" opacity="0.38"/>
              <circle cx="1740" cy="500" r="4.5" fill="url(#w03-spotFleck)" opacity="0.42" filter="url(#w03-nearSpotBlur)"/>
              <circle cx="170" cy="860" r="3.6" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="340" cy="970" r="4.0" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1530" cy="950" r="3.8" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="1730" cy="1000" r="4.2" fill="#B8C0D8" opacity="0.30"/>
            </g>
            <!-- Heavy bottom exhibition floor edge -->
            <rect x="0" y="1024" width="1920" height="76" fill="#050814" opacity="0.85"/>
            <line x1="0" y1="1024" x2="1920" y2="1024" stroke="#151B3B" stroke-width="4" opacity="0.40"/>
          </g>
        </svg>
      </div>

      <div class="wbg-scrim"></div>
      <div class="wbg-grain"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="../assets/brand/lib/motion.js"></script>
  <script src="../assets/brand-lib/motion.js"></script>
  <script>
    (function initWbg03() {
      var ID = 'wbg-03-expo-hall';
      var SLOT = 60.0;
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!root || !window.gsap) return;
      var nz = (window.RLMotion && window.RLMotion.noise1) ? window.RLMotion.noise1(73001) : function(t) { return Math.sin(t); };
      var tl = gsap.timeline({ paused: true });
      var drift = { p: 0 };

      /* 3 distinct drift rates on 3 depth planes */
      tl.to('#w03-far-drift', { x: -170, duration: SLOT, ease: 'none' }, 0);
      tl.to('#w03-mid-drift', { x: -115, duration: SLOT, ease: 'none' }, 0);
      tl.to('#w03-near-drift', { x: -60, duration: SLOT, ease: 'none' }, 0);

      /* Continuous micro-drift across slot */
      tl.to(drift, {
        p: 1, duration: SLOT, ease: 'none',
        onUpdate: function () {
          var t = tl.time();
          gsap.set('#w03-far-haze', { x: nz(t * 0.052) * 8, y: nz(t * 0.042 + 2) * 6 });
          gsap.set('#w03-mid-haze', { x: nz(t * 0.072 + 4) * 11, y: nz(t * 0.062 + 6) * 8 });
          gsap.set('#w03-near-haze', { x: nz(t * 0.092 + 8) * 14, y: nz(t * 0.082 + 10) * 10 });
        }
      }, 0);

      /* Living hold: high-bay floodlight breathing */
      tl.to('#w03-flood-rig', {
        scale: 1.03, duration: 15, yoyo: true, repeat: 3, ease: 'sine.inOut',
        transformOrigin: '76% 20%'
      }, 0);

      tl.to('#w03-mid-drift', {
        opacity: 0.80, duration: 7.2, yoyo: true, repeat: 7, ease: 'sine.inOut'
      }, 0);

      /* Slot guard */
      tl.to({}, { duration: SLOT }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
