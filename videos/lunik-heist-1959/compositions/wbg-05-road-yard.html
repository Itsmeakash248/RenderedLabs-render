<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World 05 — Road Yard</title>
</head>
<body>
<template id="wbg-05-template">
  <!-- World-BG w05 · Road Yard · slot 240.0–300.0 s · hand-authored 2D parallax environment. -->
  <!-- Environment: City road to yard gate, vehicle headlamp glow, overhead floodlights, salvage yard perimeter. -->
  <style>
    #root { position: absolute; inset: 0; }
    [data-composition-id="wbg-05-road-yard"] {
      position: absolute; inset: 0; overflow: hidden; background: transparent;
    }
    [data-composition-id="wbg-05-road-yard"] .wbg-stage { position: absolute; inset: 0; overflow: hidden; }
    [data-composition-id="wbg-05-road-yard"] .wbg-ground {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 54% 48% at 82% 20%, rgba(255,122,26,0.12) 0%, rgba(255,122,26,0.035) 40%, rgba(10,14,36,0) 72%),
        radial-gradient(ellipse 50% 44% at 18% 84%, rgba(142,95,217,0.10) 0%, rgba(10,14,36,0) 70%),
        linear-gradient(180deg, #070A12 0%, #0A0E24 24%, #151B3B 50%, #0A0E24 76%, #050814 100%),
        linear-gradient(90deg, #050814 0%, #0A0E24 16%, #0A0E24 84%, #050814 100%),
        linear-gradient(0deg, #050814 0%, rgba(5,8,20,0) 25%);
    }
    [data-composition-id="wbg-05-road-yard"] .wbg-plane { position: absolute; inset: 0; }
    [data-composition-id="wbg-05-road-yard"] .wbg-plane svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }
    [data-composition-id="wbg-05-road-yard"] .p-glow { opacity: 0.90; }
    [data-composition-id="wbg-05-road-yard"] .p-far { opacity: 0.72; }
    [data-composition-id="wbg-05-road-yard"] .p-mid { opacity: 0.86; }
    [data-composition-id="wbg-05-road-yard"] .p-near { opacity: 0.92; }
    [data-composition-id="wbg-05-road-yard"] .wbg-scrim {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 46% 42% at 50% 50%, rgba(5,8,20,0.48) 0%, rgba(5,8,20,0.18) 58%, rgba(5,8,20,0) 100%),
        radial-gradient(ellipse 92% 88% at 50% 50%, rgba(5,8,20,0) 48%, rgba(5,8,20,0.60) 100%);
    }
    [data-composition-id="wbg-05-road-yard"] .wbg-grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.28;
      background-image: radial-gradient(rgba(184,192,216,0.06) 0.6px, transparent 0.7px);
      background-size: 4px 4px;
    }
  </style>

  <div id="root" data-composition-id="wbg-05-road-yard" data-width="1920" data-height="1080" data-duration="60">
    <div class="wbg-stage">
      <div class="wbg-ground"></div>

      <!-- Yard gate floodlights & vehicle headlamp beam atmosphere -->
      <div class="wbg-plane p-glow">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="w05-gateFlood" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.32"/>
              <stop offset="30%" stop-color="#FF7A1A" stop-opacity="0.18"/>
              <stop offset="66%" stop-color="#8E5FD9" stop-opacity="0.06"/>
              <stop offset="100%" stop-color="#0A0E24" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="w05-lampFilamentCore" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#F4EFE3" stop-opacity="0.60"/>
              <stop offset="38%" stop-color="#FFD23F" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="w05-roadHaze" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#8E5FD9" stop-opacity="0.20"/>
              <stop offset="50%" stop-color="#151B3B" stop-opacity="0.10"/>
              <stop offset="100%" stop-color="#0A0E24" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="w05-gateHeader" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#050814" stop-opacity="0.80"/>
              <stop offset="50%" stop-color="#151B3B" stop-opacity="0.30"/>
              <stop offset="100%" stop-color="#050814" stop-opacity="0.80"/>
            </linearGradient>
            <filter id="w05-blurGate" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="22"/>
            </filter>
          </defs>

          <!-- Volumetric shadows around roadway margins -->
          <g id="w05-deep-void">
            <ellipse cx="960" cy="1060" rx="700" ry="220" fill="#050814" opacity="0.42" filter="url(#w05-blurGate)"/>
            <ellipse cx="140" cy="160" rx="360" ry="240" fill="#0A0E24" opacity="0.36" filter="url(#w05-blurGate)"/>
            <ellipse cx="1820" cy="480" rx="320" ry="460" fill="#050814" opacity="0.36" filter="url(#w05-blurGate)"/>
            <ellipse cx="780" cy="-60" rx="540" ry="180" fill="#0A0E24" opacity="0.36" filter="url(#w05-blurGate)"/>
            <ellipse cx="80" cy="620" rx="280" ry="320" fill="#151B3B" opacity="0.28" filter="url(#w05-blurGate)"/>
            <ellipse cx="1860" cy="980" rx="380" ry="200" fill="#0A0E24" opacity="0.36" filter="url(#w05-blurGate)"/>
          </g>

          <!-- Gatehouse mast floodlight at top right margin -->
          <g id="w05-mast-lamp">
            <ellipse cx="1600" cy="210" rx="360" ry="260" fill="url(#w05-gateFlood)" opacity="0.60"/>
            <ellipse cx="1600" cy="210" rx="140" ry="96" fill="url(#w05-lampFilamentCore)" opacity="0.65" filter="url(#w05-blurGate)"/>
            <circle cx="1595" cy="205" r="16" fill="#FFD23F" opacity="0.22"/>
            <!-- Lower left city street reflection wash -->
            <ellipse cx="280" cy="880" rx="400" ry="270" fill="url(#w05-roadHaze)" opacity="0.55"/>
          </g>

          <!-- Gate portal lintel beam across top edge (y <= 120) -->
          <g id="w05-gate-lintel" opacity="0.45">
            <rect x="0" y="-10" width="1920" height="75" fill="#050814" opacity="0.85"/>
            <rect x="0" y="62" width="1920" height="22" fill="url(#w05-gateHeader)" opacity="0.60"/>
            <line x1="0" y1="84" x2="1920" y2="84" stroke="#151B3B" stroke-width="4" opacity="0.35"/>
            <rect x="80" y="55" width="160" height="44" fill="#0A0E24" opacity="0.70"/>
            <rect x="1680" y="55" width="160" height="44" fill="#0A0E24" opacity="0.70"/>
          </g>
        </svg>
      </div>

      <!-- Far plane: distant night highway dust & road boundary silhouettes -->
      <div class="wbg-plane p-far">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g id="w05-far-drift">
            <g id="w05-far-dust">
              <!-- Edge dust particles x < 480 or x > 1440 -->
              <circle cx="110" cy="160" r="2.2" fill="#B8C0D8" opacity="0.30"/>
              <circle cx="230" cy="270" r="2.5" fill="#B8C0D8" opacity="0.32"/>
              <circle cx="350" cy="190" r="2.0" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="450" cy="250" r="2.4" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1510" cy="170" r="2.2" fill="#B8C0D8" opacity="0.26"/>
              <circle cx="1650" cy="220" r="2.8" fill="#B8C0D8" opacity="0.32"/>
              <circle cx="1790" cy="150" r="2.2" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="90" cy="830" r="2.4" fill="#B8C0D8" opacity="0.24"/>
              <circle cx="240" cy="930" r="2.8" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1550" cy="890" r="2.6" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1730" cy="840" r="3.0" fill="#B8C0D8" opacity="0.32"/>
              <circle cx="1860" cy="940" r="2.4" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="130" cy="510" r="2.0" fill="#B8C0D8" opacity="0.20"/>
              <circle cx="1800" cy="570" r="2.4" fill="#B8C0D8" opacity="0.22"/>
            </g>
            <!-- Road curb and fence boundary profiles at bottom margins -->
            <rect x="0" y="950" width="370" height="130" fill="#050814" opacity="0.65"/>
            <rect x="1550" y="950" width="370" height="130" fill="#050814" opacity="0.65"/>
            <line x1="0" y1="950" x2="370" y2="950" stroke="#151B3B" stroke-width="4" opacity="0.30"/>
            <line x1="1550" y1="950" x2="1920" y2="950" stroke="#151B3B" stroke-width="4" opacity="0.30"/>
          </g>
        </svg>
      </div>

      <!-- Mid plane: chain-link fence guide posts and yard gate uprights -->
      <div class="wbg-plane p-mid">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g id="w05-mid-drift">
            <g id="w05-mid-dust">
              <circle cx="150" cy="230" r="3.0" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="280" cy="290" r="2.8" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="430" cy="230" r="3.2" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1490" cy="250" r="3.0" fill="#B8C0D8" opacity="0.26"/>
              <circle cx="1680" cy="290" r="3.4" fill="#B8C0D8" opacity="0.30"/>
              <circle cx="1810" cy="240" r="2.8" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="110" cy="760" r="2.6" fill="#B8C0D8" opacity="0.22"/>
              <circle cx="330" cy="830" r="3.0" fill="#B8C0D8" opacity="0.26"/>
              <circle cx="1610" cy="820" r="3.2" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1780" cy="770" r="3.0" fill="#B8C0D8" opacity="0.26"/>
            </g>
            <!-- Heavy gate upright columns at canvas lateral boundaries -->
            <rect x="42" y="90" width="30" height="900" fill="#0A0E24" opacity="0.65"/>
            <rect x="1848" y="90" width="30" height="900" fill="#0A0E24" opacity="0.65"/>
            <line x1="72" y1="90" x2="72" y2="990" stroke="#151B3B" stroke-width="4" opacity="0.35"/>
            <line x1="1848" y1="90" x2="1848" y2="990" stroke="#151B3B" stroke-width="4" opacity="0.35"/>
          </g>
        </svg>
      </div>

      <!-- Near plane: foreground pavement apron edge & illuminated ember flecks -->
      <div class="wbg-plane p-near">
        <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="w05-headlampFleck" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.55"/>
              <stop offset="60%" stop-color="#FF7A1A" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#0A0E24" stop-opacity="0"/>
            </radialGradient>
            <filter id="w05-nearGateBlur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
          </defs>
          <g id="w05-near-drift">
            <g id="w05-near-flecks">
              <!-- Ember flecks swirling in gatehouse illumination -->
              <circle cx="1560" cy="270" r="4.2" fill="url(#w05-headlampFleck)" opacity="0.45" filter="url(#w05-nearGateBlur)"/>
              <circle cx="1680" cy="350" r="3.6" fill="url(#w05-headlampFleck)" opacity="0.40"/>
              <circle cx="1630" cy="460" r="3.8" fill="url(#w05-headlampFleck)" opacity="0.38"/>
              <circle cx="1750" cy="500" r="4.5" fill="url(#w05-headlampFleck)" opacity="0.42" filter="url(#w05-nearGateBlur)"/>
              <circle cx="170" cy="860" r="3.6" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="340" cy="970" r="4.0" fill="#B8C0D8" opacity="0.28"/>
              <circle cx="1530" cy="950" r="3.8" fill="#B8C0D8" opacity="0.25"/>
              <circle cx="1730" cy="1000" r="4.2" fill="#B8C0D8" opacity="0.30"/>
            </g>
            <!-- Heavy bottom road pavement curb edge -->
            <rect x="0" y="1024" width="1920" height="76" fill="#050814" opacity="0.85"/>
            <line x1="0" y1="1024" x2="1920" y2="1024" stroke="#151B3B" stroke-width="4" opacity="0.40"/>
          </g>
        </svg>
      </div>

      <div class="wbg-scrim"></div>
      <div class="wbg-grain"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="../assets/brand/lib/motion.js"></script>
  <script src="../assets/brand-lib/motion.js"></script>
  <script>
    (function initWbg05() {
      var ID = 'wbg-05-road-yard';
      var SLOT = 60.0;
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!root || !window.gsap) return;
      var nz = (window.RLMotion && window.RLMotion.noise1) ? window.RLMotion.noise1(75001) : function(t) { return Math.sin(t); };
      var tl = gsap.timeline({ paused: true });
      var drift = { p: 0 };

      /* 3 distinct drift rates on 3 depth planes */
      tl.to('#w05-far-drift', { x: -175, duration: SLOT, ease: 'none' }, 0);
      tl.to('#w05-mid-drift', { x: -118, duration: SLOT, ease: 'none' }, 0);
      tl.to('#w05-near-drift', { x: -62, duration: SLOT, ease: 'none' }, 0);

      /* Seeded continuous micro-drift across slot */
      tl.to(drift, {
        p: 1, duration: SLOT, ease: 'none',
        onUpdate: function () {
          var t = tl.time();
          gsap.set('#w05-far-dust', { x: nz(t * 0.052) * 8, y: nz(t * 0.042 + 2) * 6 });
          gsap.set('#w05-mid-dust', { x: nz(t * 0.072 + 4) * 11, y: nz(t * 0.062 + 6) * 8 });
          gsap.set('#w05-near-flecks', { x: nz(t * 0.092 + 8) * 14, y: nz(t * 0.082 + 10) * 10 });
        }
      }, 0);

      /* Living hold: gatehouse mast floodlight breathing */
      tl.to('#w05-mast-lamp', {
        scale: 1.03, duration: 15, yoyo: true, repeat: 3, ease: 'sine.inOut',
        transformOrigin: '82% 20%'
      }, 0);

      tl.to('#w05-mid-drift', {
        opacity: 0.80, duration: 7.2, yoyo: true, repeat: 7, ease: 'sine.inOut'
      }, 0);

      /* Slot guard */
      tl.to({}, { duration: SLOT }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
</body>
</html>
