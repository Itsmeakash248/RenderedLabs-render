      gsap.set(".s30-b-vert", { scaleY: 0, transformOrigin: "50% 100%" });
      gsap.set(".s30-b-face-left, .s30-b-face-right, .s30-b-face-top", { opacity: 0 });
      gsap.set(".s30-b-rim-top, .s30-b-rim-base", { strokeDashoffset: 1000 });
      gsap.set(".s30-b-slats line", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(".s30-beads", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(".s30-inner-top", { opacity: 0 });
      gsap.set(".s30-ruler", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(".s30-num", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set("#s30-tape-stretch", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#s30-tape-flash", { opacity: 0 });
      gsap.set("#s30-badge-inner", { opacity: 0, scale: 1.4, rotation: -4, transformOrigin: "50% 50%" });
      gsap.set("#s30-snap-wipe rect", { x: -1400 });
      gsap.set("#s30-flash", { opacity: 0 });
