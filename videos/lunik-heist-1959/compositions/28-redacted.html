  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      gsap.set("#s28-page", { rotationX: 14, rotationY: -8, rotationZ: -1.5, scale: 0.96, transformOrigin: "50% 50%" });
      gsap.set("#s28-page-fill", { opacity: 0 });
      gsap.set(".s28-page-inner", { opacity: 0 });
      gsap.set("#s28-page-edge", { strokeDashoffset: 4100 });
      gsap.set("#s28-header", { scaleX: 0, transformOrigin: "50% 50%" });
      gsap.set("#s28-rows line", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(".s28-pill", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(".s28-bar", { scaleX: 0, transformOrigin: "100% 50%" });
      gsap.set("#s28-lock", { opacity: 0, y: -120, scaleY: 1.15, transformOrigin: "50% 100%" });
      gsap.set("#s28-shackle", { rotation: -34, transformOrigin: "50% 100%" });
      gsap.set("#s28-lock-ring", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" });
      gsap.set("#s28-badge", { opacity: 0, scale: 1.4, rotation: -4, transformOrigin: "50% 50%" });
      gsap.set("#s28-wipe rect", { x: 3200 });
      gsap.set("#s28-flash-bloom", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" });
      gsap.set("#s28-flash", { opacity: 0 });

      /* ---------- phase 1: page draws with ruled rows ---------- */
      tl.to("#s28-page-fill", { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.1);
      tl.to(".s28-page-inner", { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.9);
      tl.to("#s28-page-edge", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 0.15);
      tl.to("#s28-page", { scale: 1, duration: 1.3, ease: "power3.out" }, 0.1);
      tl.to("#s28-header", { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.45);
      tl.to("#s28-rows line", { scaleX: 1, duration: 0.9, stagger: 0.055, ease: "power2.out" }, 0.7);
      tl.to("#s28-badge", { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.4)" }, 1.0);
      tl.to("#s28-badge", { y: -5, duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut" }, 2.2);

      /* ---------- phase 2: four gold category pills ---------- */
      tl.to(".s28-pill", { opacity: 1, scale: 1, duration: 0.5, stagger: 0.12, ease: "back.out(2.6)" }, 1.5);
      tl.to(".s28-pill", { scale: 1.04, duration: 0.6, yoyo: true, repeat: 2, stagger: 0.06, ease: "sine.inOut" }, 3.0);

      /* ---------- phase 3: redaction bars ink over the engineering column ---------- */
      tl.to(".s28-bar", { scaleX: 1, duration: 0.38, stagger: 0.06, ease: "power2.out" }, 2.9);
      tl.to("#s28-bars", { x: 4, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 3.7);

      /* ---------- phase 4: padlock capsule snaps shut ---------- */
      tl.to("#s28-lock", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 4.8);
      tl.to("#s28-lock", { scaleY: 0.92, duration: 0.12, yoyo: true, repeat: 1, transformOrigin: "50% 100%", ease: "power2.out" }, 5.35);
      tl.to("#s28-shackle", { rotation: 0, duration: 0.5, ease: "back.out(2.6)" }, 5.45);
      tl.to("#s28-lock-ring", { opacity: 0.85, scale: 1.25, duration: 0.4, ease: "power2.out" }, 5.55);
      tl.to("#s28-lock-ring", { opacity: 0, scale: 1.8, duration: 0.45, ease: "power2.in" }, 5.95);
      tl.to("#s28-page", { rotationX: 14, rotationZ: -3.4, y: 8, duration: 1.2, ease: "power2.inOut" }, 6.0);

      /* ---------- living holds ---------- */
      tl.to("#s28-page", { y: 2, duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut" }, 6.6);
      tl.to("#s28-lock", { y: -5, duration: 0.6, yoyo: true, repeat: 2, ease: "sine.inOut" }, 6.5);
      tl.to("#s28-dust circle", { y: -14, duration: 0.6, yoyo: true, repeat: 2, stagger: 0.08, ease: "sine.inOut" }, 1.0);
      tl.to("#s28-dust circle", { y: 8, duration: 0.6, yoyo: true, repeat: 2, stagger: 0.08, ease: "sine.inOut" }, 4.4);

      /* ---------- camera and parallax planes ---------- */
      tl.fromTo("#s28-world", { rotationY: -2.4, scale: 1.0 }, { rotationY: 2.4, scale: 1.04, duration: 8.86, transformOrigin: "50% 52%", ease: "sine.inOut" }, 0);
      tl.fromTo("#s28-bg", { x: 12 }, { x: -12, duration: 8.86, ease: "sine.inOut" }, 0);
      tl.fromTo("#s28-page", { x: -6 }, { x: 6, duration: 8.86, ease: "sine.inOut" }, 0);
      tl.fromTo("#s28-fg", { x: 16 }, { x: -16, duration: 8.86, ease: "sine.inOut" }, 0);

      /* ---------- exit: swift redaction-bar sweep ---------- */
      tl.to("#s28-wipe rect", { x: -1400, duration: 0.55, stagger: 0.07, ease: "power2.in" }, 7.7);
      tl.to("#s28-wipe", { opacity: 0, duration: 0.25, ease: "power1.in" }, 8.35);
      tl.to("#s28-flash-bloom", { opacity: 0.9, scale: 1.1, duration: 0.35, ease: "power2.out" }, 8.35);
      tl.to("#s28-flash-bloom", { opacity: 0, scale: 1.8, duration: 0.35, ease: "power2.in" }, 8.45);
