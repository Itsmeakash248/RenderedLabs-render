<body>
  <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="9.980">

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = gsap.timeline({ paused: true });
    window.__timelines["root"].to({}, { duration: 9.980 }, 0);
  </script>
</body>
</html>
