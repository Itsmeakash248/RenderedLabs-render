<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="RenderedLabs packaged artwork, inverted stage composition">
  <!-- Archetype 1: Inverted Stage. Hero apparatus left, overlay type upper-right, badge right. -->
  <defs>
    <linearGradient id="g-ground" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#151B3B"/>
      <stop offset="42%" stop-color="#0A0E24"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <radialGradient id="g-nebula" cx="0.26" cy="0.52" r="0.62">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.34"/>
      <stop offset="34%" stop-color="#8E5FD9" stop-opacity="0.22"/>
      <stop offset="72%" stop-color="#151B3B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.95"/>
      <stop offset="26%" stop-color="#FF7A1A" stop-opacity="0.62"/>
      <stop offset="62%" stop-color="#8E5FD9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8E5FD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-orb" cx="0.34" cy="0.30" r="0.75">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="22%" stop-color="#FFD23F"/>
      <stop offset="62%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#8E5FD9"/>
    </radialGradient>
    <linearGradient id="g-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C0D8"/>
      <stop offset="38%" stop-color="#151B3B"/>
      <stop offset="100%" stop-color="#0A0E24"/>
    </linearGradient>
    <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151B3B"/>
      <stop offset="55%" stop-color="#0A0E24"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="g-scrim-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050814" stop-opacity="0"/>
      <stop offset="38%" stop-color="#050814" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="g-shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD23F" stop-opacity="0"/>
      <stop offset="55%" stop-color="#FF7A1A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFD23F" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="g-dead" cx="1" cy="1" r="0.7">
      <stop offset="0%" stop-color="#050814" stop-opacity="0.99"/>
      <stop offset="58%" stop-color="#050814" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-rim" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="g1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="g2"/>
      <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-text" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Ground, nebula, stars -->
  <rect width="1920" height="1080" fill="url(#g-ground)"/>
  <rect width="1920" height="1080" fill="url(#g-nebula)"/>
  <g fill="#F4EFE3" opacity="0.55">
    <circle cx="180" cy="120" r="3"/><circle cx="330" cy="210" r="2"/><circle cx="640" cy="90" r="2.5"/>
    <circle cx="860" cy="180" r="2"/><circle cx="1080" cy="110" r="3"/><circle cx="1300" cy="70" r="2"/>
    <circle cx="1520" cy="190" r="2.5"/><circle cx="1760" cy="120" r="3"/><circle cx="1820" cy="320" r="2"/>
    <circle cx="210" cy="900" r="2"/><circle cx="760" cy="960" r="2.5"/><circle cx="1180" cy="1010" r="2"/>
  </g>

  <!-- Volumetric shafts rising out of the opened roof -->
  <g filter="url(#f-soft)" opacity="0.55">
    <polygon points="470,300 250,20 400,20" fill="url(#g-shaft)"/>
    <polygon points="470,300 600,20 760,20" fill="url(#g-shaft)"/>
    <polygon points="470,300 120,140 140,320" fill="url(#g-shaft)"/>
  </g>

  <!-- HERO: shipping crate with the upper stage inside -->
  <g transform="translate(480,560)">
    <ellipse cx="0" cy="250" rx="360" ry="70" fill="#050814" opacity="0.9"/>
    <ellipse cx="0" cy="-10" rx="430" ry="380" fill="url(#g-aura)" opacity="0.55"/>

    <!-- Crate shell -->
    <rect x="-300" y="-170" width="600" height="450" rx="20" fill="url(#g-wood)" stroke="#050814" stroke-width="30" stroke-linejoin="round"/>

    <!-- Wood plank seams across the shell border -->
    <g stroke="#050814" stroke-width="10" stroke-linecap="round" opacity="0.9">
      <line x1="-286" y1="-136" x2="286" y2="-136"/>
      <line x1="-286" y1="246" x2="286" y2="246"/>
      <line x1="-286" y1="212" x2="286" y2="212"/>
    </g>
    <g stroke="#B8C0D8" stroke-width="6" stroke-linecap="round" opacity="0.45">
      <line x1="-286" y1="-132" x2="286" y2="-132"/>
      <line x1="-286" y1="250" x2="286" y2="250"/>
      <line x1="-286" y1="216" x2="286" y2="216"/>
    </g>

    <!-- Corner battens and survey bolts -->
    <rect x="-300" y="-170" width="46" height="450" rx="14" fill="#0A0E24" stroke="#050814" stroke-width="16"/>
    <rect x="254" y="-170" width="46" height="450" rx="14" fill="#0A0E24" stroke="#050814" stroke-width="16"/>
    <g fill="#F4EFE3" stroke="#050814" stroke-width="8">
      <circle cx="-277" cy="-146" r="12"/><circle cx="277" cy="-146" r="12"/>
      <circle cx="-277" cy="254" r="12"/><circle cx="277" cy="254" r="12"/>
    </g>

    <!-- Irregular torn opening -->
    <path d="M -238,-108 L -120,-122 L 22,-110 L 152,-124 L 236,-104 L 228,58 L 240,200 L 92,214 L -58,202 L -202,216 L -244,194 Z"
          fill="#050814" stroke="#050814" stroke-width="22" stroke-linejoin="round"/>
    <ellipse cx="0" cy="66" rx="236" ry="166" fill="#FF7A1A" opacity="0.22" filter="url(#f-soft)"/>

    <!-- Base cap with its ring of square-headed bolts -->
    <circle cx="-150" cy="52" r="98" fill="#0A0E24" stroke="#050814" stroke-width="26"/>
    <circle cx="-150" cy="52" r="66" fill="#151B3B" stroke="#8E5FD9" stroke-width="10"/>
    <g fill="#B8C0D8" stroke="#050814" stroke-width="6">
      <circle cx="-150" cy="-18" r="10"/><circle cx="-99" cy="-2" r="10"/><circle cx="-71" cy="42" r="10"/>
      <circle cx="-83" cy="96" r="10"/><circle cx="-129" cy="120" r="10"/><circle cx="-178" cy="105" r="10"/>
      <circle cx="-210" cy="64" r="10"/><circle cx="-205" cy="16" r="10"/><circle cx="-187" cy="-12" r="10"/>
      <circle cx="-112" cy="-26" r="10"/>
    </g>

    <!-- Upper stage hardware inside the crate -->
    <rect x="-96" y="-14" width="244" height="152" rx="76" fill="url(#g-metal)" stroke="#050814" stroke-width="26"/>
    <polygon points="148,-14 306,62 148,138" fill="#151B3B" stroke="#050814" stroke-width="26" stroke-linejoin="round"/>
    <circle cx="-34" cy="34" r="58" fill="url(#g-orb)" stroke="#050814" stroke-width="20"/>
    <circle cx="-52" cy="16" r="18" fill="#FFFFFF" opacity="0.95"/>
    <line x1="20" y1="34" x2="286" y2="62" stroke="#F4EFE3" stroke-width="9" stroke-linecap="round"/>
    <circle cx="70" cy="112" r="36" fill="#8E5FD9" stroke="#050814" stroke-width="18"/>
    <circle cx="58" cy="102" r="11" fill="#F4EFE3" opacity="0.85"/>

    <!-- Dual-tone rim light on the hardware -->
    <g filter="url(#f-rim)">
      <path d="M -96,-14 L 148,-14" fill="none" stroke="#8E5FD9" stroke-width="16" stroke-linecap="round"/>
      <path d="M -96,-14 L 148,-14" fill="none" stroke="#F4EFE3" stroke-width="6" stroke-linecap="round"/>
      <path d="M 150,-6 L 302,62" fill="none" stroke="#FF7A1A" stroke-width="16" stroke-linecap="round"/>
      <path d="M 150,-6 L 302,62" fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Pried roof planks with grain -->
    <g transform="rotate(-8 -120 -230)">
      <rect x="-340" y="-268" width="690" height="48" rx="12" fill="#0A0E24" stroke="#050814" stroke-width="24"/>
      <rect x="-340" y="-268" width="690" height="48" rx="12" fill="none" stroke="#FF7A1A" stroke-width="10" opacity="0.8"/>
      <g stroke="#B8C0D8" stroke-width="6" stroke-linecap="round" opacity="0.5">
        <line x1="-280" y1="-254" x2="-120" y2="-254"/><line x1="20" y1="-252" x2="220" y2="-252"/>
      </g>
    </g>
    <g transform="rotate(-3 40 -210)">
      <rect x="-320" y="-222" width="650" height="44" rx="12" fill="#151B3B" stroke="#050814" stroke-width="22"/>
      <rect x="-320" y="-222" width="650" height="44" rx="12" fill="none" stroke="#8E5FD9" stroke-width="10" opacity="0.8"/>
      <g stroke="#B8C0D8" stroke-width="6" stroke-linecap="round" opacity="0.5">
        <line x1="-250" y1="-208" x2="-60" y2="-208"/><line x1="90" y1="-206" x2="260" y2="-206"/>
      </g>
    </g>
    <rect x="-352" y="-188" width="152" height="30" rx="8" fill="#B8C0D8" stroke="#050814" stroke-width="14"/>
    <rect x="214" y="-188" width="150" height="30" rx="8" fill="#B8C0D8" stroke="#050814" stroke-width="14"/>

    <!-- Two pry bars levering the roof -->
    <line x1="-306" y1="-238" x2="-208" y2="-58" stroke="#050814" stroke-width="26" stroke-linecap="round"/>
    <line x1="-306" y1="-238" x2="-208" y2="-58" stroke="#F4EFE3" stroke-width="13" stroke-linecap="round"/>
    <line x1="176" y1="-250" x2="104" y2="-96" stroke="#050814" stroke-width="24" stroke-linecap="round"/>
    <line x1="176" y1="-250" x2="104" y2="-96" stroke="#FFD23F" stroke-width="11" stroke-linecap="round"/>

    <!-- Crate edge dual rim light -->
    <g filter="url(#f-rim)">
      <path d="M -300,-168 L -300,278" fill="none" stroke="#8E5FD9" stroke-width="16" stroke-linecap="round"/>
      <path d="M -300,-168 L -300,278" fill="none" stroke="#F4EFE3" stroke-width="6" stroke-linecap="round"/>
      <path d="M 300,-168 L 300,278" fill="none" stroke="#FF7A1A" stroke-width="16" stroke-linecap="round"/>
      <path d="M 300,-168 L 300,278" fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right-side scrim for type contrast -->
  <rect x="930" y="0" width="990" height="1080" fill="url(#g-scrim-r)"/>

  <!-- Wide violet glow behind type -->
  <g filter="url(#f-soft)" opacity="0.5">
    <ellipse cx="1420" cy="430" rx="420" ry="300" fill="#8E5FD9" opacity="0.32"/>
  </g>

  <!-- 4-point glints -->
  <g filter="url(#f-rim)">
    <g transform="translate(1760,250)"><polygon points="0,-30 3,-6 28,0 3,6 0,30 -3,6 -28,0 -3,-6" fill="#F4EFE3"/></g>
    <g transform="translate(1000,180)"><polygon points="0,-20 2,-4 20,0 2,4 0,20 -2,4 -20,0 -2,-4" fill="#FFD23F"/></g>
  </g>

  <!-- OVERLAY TYPE: 130 BOLTS -->
  <g filter="url(#f-text)">
    <text x="1096" y="418" font-family="Archivo Black" font-size="148" letter-spacing="-4"
          fill="#FFD23F" stroke="#050814" stroke-width="27" stroke-linejoin="round" paint-order="stroke fill">130</text>
    <text x="1096" y="582" font-family="Archivo Black" font-size="148" letter-spacing="-4"
          fill="#F4EFE3" stroke="#050814" stroke-width="27" stroke-linejoin="round" paint-order="stroke fill">BOLTS</text>
  </g>
  <g>
    <rect x="1100" y="622" width="560" height="18" rx="9" fill="#8E5FD9"/>
    <rect x="1100" y="622" width="300" height="18" rx="9" fill="#FF7A1A"/>
    <rect x="1100" y="622" width="110" height="18" rx="9" fill="#FFD23F"/>
  </g>

  <!-- METRIC BADGE -->
  <g transform="translate(1100,720)" filter="url(#f-text)">
    <rect x="0" y="0" width="500" height="84" rx="42" fill="#151B3B" stroke="#FF7A1A" stroke-width="9"/>
    <circle cx="46" cy="42" r="14" fill="#FFD23F" filter="url(#f-rim)"/>
    <circle cx="46" cy="42" r="6" fill="#FFFFFF"/>
    <text x="82" y="54" font-family="Quicksand" font-weight="700" font-size="32" letter-spacing="1.5" fill="#F4EFE3">8.5 HRS &#8226; 4 A.M.</text>
  </g>

  <!-- Dead-zone shield, bottom-right -->
  <rect x="1350" y="790" width="570" height="290" fill="url(#g-dead)"/>
</svg>
