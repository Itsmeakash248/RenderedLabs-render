<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="RenderedLabs packaged artwork, center radial composition">
  <!-- Archetype 2: Center Radial Split. Hero payload sphere dead center, top banner, badge lower-left. -->
  <defs>
    <linearGradient id="g-ground" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#151B3B"/>
      <stop offset="48%" stop-color="#0A0E24"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <radialGradient id="g-nebula" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.36"/>
      <stop offset="34%" stop-color="#8E5FD9" stop-opacity="0.24"/>
      <stop offset="72%" stop-color="#151B3B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.9"/>
      <stop offset="28%" stop-color="#FF7A1A" stop-opacity="0.55"/>
      <stop offset="62%" stop-color="#8E5FD9" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8E5FD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-orb" cx="0.36" cy="0.30" r="0.72">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFD23F"/>
      <stop offset="58%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#8E5FD9"/>
    </radialGradient>
    <linearGradient id="g-seam-l" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFD23F" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#FF7A1A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-seam-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E5FD9" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#8E5FD9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8E5FD9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-dead" cx="1" cy="1" r="0.7">
      <stop offset="0%" stop-color="#050814" stop-opacity="0.99"/>
      <stop offset="58%" stop-color="#050814" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-rim" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="g1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="26" result="g2"/>
      <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-laser" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="38" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-text" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#g-ground)"/>
  <rect width="1920" height="1080" fill="url(#g-nebula)"/>

  <!-- Star field -->
  <g fill="#F4EFE3" opacity="0.55">
    <circle cx="140" cy="90" r="3"/><circle cx="330" cy="170" r="2"/><circle cx="560" cy="70" r="2.5"/>
    <circle cx="760" cy="150" r="2"/><circle cx="1180" cy="80" r="3"/><circle cx="1420" cy="160" r="2"/>
    <circle cx="1660" cy="90" r="2.5"/><circle cx="1820" cy="230" r="2"/><circle cx="120" cy="610" r="2"/>
    <circle cx="1810" cy="620" r="2.5"/><circle cx="260" cy="980" r="2"/><circle cx="1560" cy="1010" r="2"/>
  </g>

  <!-- Radial god rays from the center -->
  <g filter="url(#f-soft)" opacity="0.5">
    <polygon points="960,650 700,60 810,60" fill="#FFD23F" opacity="0.20"/>
    <polygon points="960,650 1120,40 1240,70" fill="#FF7A1A" opacity="0.18"/>
    <polygon points="960,650 1440,160 1520,280" fill="#8E5FD9" opacity="0.16"/>
    <polygon points="960,650 380,220 340,340" fill="#8E5FD9" opacity="0.14"/>
  </g>

  <!-- Horizon clash bands -->
  <g filter="url(#f-laser)">
    <rect x="0" y="628" width="760" height="44" fill="url(#g-seam-l)"/>
    <rect x="1160" y="628" width="760" height="44" fill="url(#g-seam-r)"/>
    <line x1="0" y1="650" x2="760" y2="650" stroke="#FFD23F" stroke-width="14" stroke-linecap="round"/>
    <line x1="1160" y1="650" x2="1920" y2="650" stroke="#8E5FD9" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- HERO: payload sphere with bolt ring -->
  <g transform="translate(960,650)">
    <circle cx="0" cy="0" r="420" fill="url(#g-aura)" opacity="0.5"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="#8E5FD9" stroke-width="10" stroke-dasharray="30 22" opacity="0.8"/>
    <circle cx="0" cy="0" r="258" fill="none" stroke="#FFD23F" stroke-width="12" opacity="0.75"/>

    <!-- Bolt ring: 20 square-headed bolts -->
    <g fill="#151B3B" stroke="#050814" stroke-width="8">
      <circle cx="0" cy="-252" r="17"/><circle cx="79" cy="-239" r="17"/><circle cx="154" cy="-200" r="17"/>
      <circle cx="214" cy="-133" r="17"/><circle cx="248" cy="-48" r="17"/><circle cx="252" cy="42" r="17"/>
      <circle cx="219" cy="125" r="17"/><circle cx="160" cy="195" r="17"/><circle cx="85" cy="238" r="17"/>
      <circle cx="3" cy="252" r="17"/><circle cx="-79" cy="239" r="17"/><circle cx="-154" cy="200" r="17"/>
      <circle cx="-214" cy="133" r="17"/><circle cx="-248" cy="48" r="17"/><circle cx="-252" cy="-42" r="17"/>
      <circle cx="-219" cy="-125" r="17"/><circle cx="-160" cy="-195" r="17"/><circle cx="-85" cy="-238" r="17"/>
    </g>

    <!-- Payload sphere -->
    <circle cx="0" cy="0" r="204" fill="url(#g-orb)" stroke="#050814" stroke-width="30"/>
    <circle cx="0" cy="0" r="204" fill="none" stroke="#FFD23F" stroke-width="10" opacity="0.85"/>
    <!-- Satellite collar and meridian band -->
    <ellipse cx="0" cy="0" rx="198" ry="48" fill="none" stroke="#050814" stroke-width="24" transform="rotate(-24)"/>
    <ellipse cx="0" cy="0" rx="198" ry="48" fill="none" stroke="#B8C0D8" stroke-width="11" opacity="0.95" transform="rotate(-24)"/>
    <ellipse cx="0" cy="0" rx="58" ry="200" fill="none" stroke="#050814" stroke-width="20"/>
    <ellipse cx="0" cy="0" rx="58" ry="200" fill="none" stroke="#F4EFE3" stroke-width="8" opacity="0.75"/>

    <!-- Specular highlight -->
    <path d="M -120,-120 A 170 170 0 0 1 40,-168 A 160 160 0 0 0 -120,-60 Z" fill="#FFFFFF" opacity="0.85"/>

    <!-- Antenna probe -->
    <line x1="0" y1="-204" x2="0" y2="-336" stroke="#050814" stroke-width="28" stroke-linecap="round"/>
    <line x1="0" y1="-204" x2="0" y2="-336" stroke="#F4EFE3" stroke-width="13" stroke-linecap="round"/>
    <circle cx="0" cy="-346" r="19" fill="#FFD23F" stroke="#050814" stroke-width="10"/>
    <line x1="-150" y1="-140" x2="-236" y2="-226" stroke="#050814" stroke-width="24" stroke-linecap="round"/>
    <line x1="-150" y1="-140" x2="-236" y2="-226" stroke="#FFD23F" stroke-width="10" stroke-linecap="round"/>
    <line x1="150" y1="-140" x2="236" y2="-226" stroke="#050814" stroke-width="24" stroke-linecap="round"/>
    <line x1="150" y1="-140" x2="236" y2="-226" stroke="#8E5FD9" stroke-width="10" stroke-linecap="round"/>

    <!-- Dual-tone rim light -->
    <g filter="url(#f-rim)">
      <path d="M -196,58 A 204 204 0 0 1 -150,-138" fill="none" stroke="#8E5FD9" stroke-width="16" stroke-linecap="round"/>
      <path d="M -196,58 A 204 204 0 0 1 -150,-138" fill="none" stroke="#F4EFE3" stroke-width="6" stroke-linecap="round"/>
      <path d="M 196,-58 A 204 204 0 0 1 150,138" fill="none" stroke="#FF7A1A" stroke-width="16" stroke-linecap="round"/>
      <path d="M 196,-58 A 204 204 0 0 1 150,138" fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- SEAL + WIRE in the foreground -->
  <g transform="translate(960,880)">
    <path d="M -150,-58 C -230,10 -210,96 -120,104 C -40,110 20,80 70,44" fill="none" stroke="#050814" stroke-width="24" stroke-linecap="round"/>
    <path d="M -150,-58 C -230,10 -210,96 -120,104 C -40,110 20,80 70,44" fill="none" stroke="#F4EFE3" stroke-width="10" stroke-linecap="round"/>
    <rect x="-52" y="-40" width="164" height="96" rx="22" fill="#8E5FD9" stroke="#050814" stroke-width="16"/>
    <rect x="-28" y="-16" width="116" height="48" rx="10" fill="#0A0E24" stroke="#FFD23F" stroke-width="10"/>
    <circle cx="30" cy="8" r="16" fill="none" stroke="#FFD23F" stroke-width="8"/>
    <path d="M 22,8 L 30,-4 L 38,8 L 30,20 Z" fill="#FFD23F"/>
  </g>

  <!-- OVERLAY TYPE: FAKE SEAL -->
  <g filter="url(#f-text)">
    <text x="960" y="206" text-anchor="middle" font-family="Archivo Black" font-size="152" letter-spacing="-3"
          fill="#F4EFE3" stroke="#050814" stroke-width="27" stroke-linejoin="round" paint-order="stroke fill">FAKE</text>
    <text x="960" y="374" text-anchor="middle" font-family="Archivo Black" font-size="152" letter-spacing="-3"
          fill="#FFD23F" stroke="#050814" stroke-width="27" stroke-linejoin="round" paint-order="stroke fill">SEAL</text>
  </g>

  <!-- METRIC BADGE, lower-left -->
  <g transform="translate(110,898)" filter="url(#f-text)">
    <rect x="0" y="0" width="520" height="84" rx="42" fill="#151B3B" stroke="#8E5FD9" stroke-width="9"/>
    <circle cx="46" cy="42" r="14" fill="#FFD23F" filter="url(#f-rim)"/>
    <circle cx="46" cy="42" r="6" fill="#FFFFFF"/>
    <text x="82" y="54" font-family="Quicksand" font-weight="700" font-size="32" letter-spacing="1.4" fill="#F4EFE3">2 COUPLINGS &#8226; 1 SEAL</text>
  </g>

  <!-- Dead-zone shield, bottom-right -->
  <rect x="1350" y="790" width="570" height="290" fill="url(#g-dead)"/>
</svg>
