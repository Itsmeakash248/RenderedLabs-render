<!doctype html><html><head><meta charset="utf-8"></head><body><template id="wbg03-template">

<script>
(function initWbg03(){
  var ID = "wbg-03-furnace-island";
  var tl = gsap.timeline({ paused: true });
  tl.to({}, { duration: 60.000 }, 0);

  tl.fromTo("#wbg03-bg", { x: 0, y: 0 }, { x: -22, y: 4, duration: 60, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
  tl.fromTo("#wbg03-mg", { x: 0, y: 0 }, { x: -54, y: -6, duration: 46, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
  tl.fromTo("#wbg03-fg", { x: 0, y: 0 }, { x: -96, y: 12, duration: 34, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

  tl.fromTo(".w03-ember", { y: 0, x: 0, opacity: 0.8 }, { y: -210, x: 34, opacity: 0, duration: 18, ease: "sine.out", repeat: 2, stagger: 1.6 }, 0);
  tl.fromTo(".w03-spark", { y: 0, x: 0, opacity: 0.4 }, { y: -160, x: -22, opacity: 0, duration: 14, ease: "sine.out", repeat: 3, stagger: 1.1 }, 2);

  // the haze bands slide
  tl.fromTo("#wbg03-bg", { opacity: 0.92 }, { opacity: 1, duration: 22, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
