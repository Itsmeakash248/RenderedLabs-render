<script>
(function initWbg04(){
  var ID = "wbg-04-alpine-route";
  var tl = gsap.timeline({ paused: true });
  tl.to({}, {duration:60.000},0);

  // three depth planes: far 0.2 px/s, mid 0.7 px/s, near 1.4 px/s
  tl.fromTo("#wbg04-bg", { x: 0, y: 0 }, { x: 6, y: 2, duration: 30, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
  tl.fromTo("#wbg04-mg", { x: 0, y: 0 }, { x: 21, y: -4, duration: 30, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
  tl.fromTo("#wbg04-fg", { x: 0, y: 0 }, { x: 42, y: 7, duration: 30, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

  // the valley haze slides against the ridges
  tl.fromTo(".w04-mist", { x: 0, y: 0 }, { x: -16, y: 3, duration: 24, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 1.4 }, 0);

  // dust hangs and turns slowly in the light
  tl.fromTo(".w04-mote", { x: 0, y: 0, opacity: 0.38 }, { x: 10, y: -26, opacity: 0.58, duration: 17, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 1.2 }, 1);

  // the dawn breathes once across the slot
  tl.to("#wbg04-bg", { opacity: 0.94, duration: 30, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
