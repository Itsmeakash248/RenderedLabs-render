<script>
(function initS01(){
  var ID = "s01-gilded-tally";
  var root = document.querySelector('[data-composition-id="' + ID + '"]');
  var q = function(sel){ return root.querySelector(sel); };
  var tl = gsap.timeline({ paused: true });

  // ── SLOT GUARD ────────────────────────────────────────────────────────────
  tl.to({}, { duration: 18.993 }, 0);

  // ── BEAD FIELD: 17 brass tally beads on the rail ──────────────────────────
  var beadNS = "http://www.w3.org/2000/svg";
  var beadGroup = q("#s01-beads");
  var beads = [];
  for (var i = 0; i < 17; i++) {
    var x = 170 + i * (1560 / 16);
    var halo = document.createElementNS(beadNS, "circle");
    halo.setAttribute("cx", x); halo.setAttribute("cy", 950); halo.setAttribute("r", 26);
    halo.setAttribute("fill", "#D9822B"); halo.setAttribute("opacity", "0.0");
    var bead = document.createElementNS(beadNS, "circle");
    bead.setAttribute("cx", x); bead.setAttribute("cy", 950); bead.setAttribute("r", 13);
    bead.setAttribute("fill", "#C89D42"); bead.setAttribute("stroke", "#1E1813"); bead.setAttribute("stroke-width", "5");
    bead.setAttribute("class", "s01-bead"); bead.style.transformBox = "fill-box"; bead.style.transformOrigin = "center";
    beadGroup.appendChild(halo); beadGroup.appendChild(bead);
    beads.push({ bead: bead, halo: halo, x: x });
  }

  // ── MOTES: seeded positions, no Math.random ───────────────────────────────
  var moteGroup = q("#s01-motes");
  var motes = [];
  for (var m = 0; m < 26; m++) {
    var mx = 120 + ((m * 733) % 1680);
    var my = 140 + ((m * 419) % 800);
    var mr = 2.5 + ((m * 7) % 5);
    var c = document.createElementNS(beadNS, "circle");
    c.setAttribute("cx", mx); c.setAttribute("cy", my); c.setAttribute("r", mr);
    c.setAttribute("fill", "#FAF7F0"); c.setAttribute("opacity", "0.55"); c.setAttribute("class", "s01-mote");
    moteGroup.appendChild(c); motes.push(c);
  }

  // ── PHASE 1: architectural scaffold draws ─────────────────────────────────
  tl.fromTo("#s01-ghost", { opacity: 0 }, { opacity: 0.055, duration: 1.6, ease: "sine.out" }, 0.10);

  var frameLines = root.querySelectorAll(".s01-frame-line");
  frameLines.forEach(function(line, i){
    var len = 1150;
    tl.fromTo(line, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } },
              { attr: { "stroke-dashoffset": 0 }, duration: 1.15, ease: "power2.out" }, 0.34 + i * 0.14);
  });
  tl.fromTo("#s01-frames", { y: 10 }, { y: 0, duration: 2.6, ease: "sine.out" }, 0.30);

  // ── PHASE 1b: keystones drop, parquet settles, glass sheen wakes ──────────
  tl.fromTo("#s01-archivolts", { opacity: 0 }, { opacity: 0.72, duration: 0.5, ease: "sine.out" }, 1.22);
  tl.fromTo(".s01-archivolt", { attr: { "stroke-dashoffset": 1180 } },
            { attr: { "stroke-dashoffset": 0 }, duration: 1.05, ease: "power2.out", stagger: 0.11 }, 1.26);
  tl.fromTo("#s01-floor", { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "sine.out" }, 1.05);
  tl.to("#s01-floor", { opacity: 0.62, duration: 5.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.60);
  tl.fromTo(".s01-sheen-line", { attr: { "stroke-dashoffset": 240 } },
            { attr: { "stroke-dashoffset": -1180 }, duration: 2.4, ease: "power1.inOut", stagger: 0.28 }, 6.10);
  tl.to(".s01-sheen-line", { opacity: 0.35, duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.14 }, 8.70);

  // ── PHASE 2: photograph blooms upward through the arch mask ───────────────
  var masks = [q("#s01-m1"), q("#s01-m2"), q("#s01-m3"), q("#s01-m4"), q("#s01-m5")];
  masks.forEach(function(path, i){
    path.style.transformBox = "fill-box";
    path.style.transformOrigin = "50% 100%";
    tl.fromTo(path, { scaleY: 0 }, { scaleY: 1, duration: 1.25, ease: "power3.out" }, 0.55 + i * 0.13);
  });
  tl.fromTo("#s01-photo", { scale: 1.075, x: -18, transformOrigin: "50% 60%" },
            { scale: 1.0, x: 0, duration: 7.6, ease: "sine.out" }, 0.55);

  // ── PHASE 3: tally rail + 17 beads socket in ──────────────────────────────
  tl.fromTo("#s01-rail-line", { attr: { "stroke-dasharray": 1620, "stroke-dashoffset": 1620 } },
            { attr: { "stroke-dashoffset": 0 }, duration: 1.35, ease: "power2.inOut" }, 2.15);
  tl.fromTo("#s01-rail-brass", { attr: { "stroke-dasharray": 1620, "stroke-dashoffset": 1620 } },
            { attr: { "stroke-dashoffset": 0 }, duration: 1.35, ease: "power2.inOut" }, 2.28);

  beads.forEach(function(b, i){
    tl.fromTo(b.bead, { y: -70, scale: 0.55 }, { y: 0, scale: 1, duration: 0.62, ease: "back.out(2.2)" }, 2.55 + i * 0.115);
    tl.to(b.halo, { opacity: 0.30, duration: 0.35, ease: "sine.out" }, 2.62 + i * 0.115);
    tl.to(b.halo, { opacity: 0.0, duration: 1.1, ease: "sine.in" }, 2.95 + i * 0.115);
