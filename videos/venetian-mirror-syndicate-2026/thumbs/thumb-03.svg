<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="A colossal terracotta wax seal and brass stiletto on an archival decree in the lower-right, confronting text on the top-left and badge at mid-left">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="46%" stop-color="#F5EFEB"/>
      <stop offset="100%" stop-color="#EAE0D0"/>
    </linearGradient>

    <radialGradient id="ambient" cx="0.70" cy="0.55" r="0.65">
      <stop offset="0%" stop-color="#C2593F" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#D9822B" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#EAE0D0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#EAE0D0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wax" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0%" stop-color="#E07352"/>
      <stop offset="30%" stop-color="#C2593F"/>
      <stop offset="65%" stop-color="#9C3A24"/>
      <stop offset="100%" stop-color="#6E2312"/>
    </radialGradient>

    <radialGradient id="waxSheen" cx="0.35" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#FAF7F0" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#F6D79B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C2593F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brassBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="30%" stop-color="#F0D9A4"/>
      <stop offset="60%" stop-color="#C89D42"/>
      <stop offset="100%" stop-color="#70551F"/>
    </linearGradient>

    <linearGradient id="daggerHandle" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3A2B20"/>
      <stop offset="50%" stop-color="#1E1813"/>
      <stop offset="100%" stop-color="#0E0A08"/>
    </linearGradient>

    <radialGradient id="cornerHaze" cx="1" cy="1" r="0.65">
      <stop offset="0%" stop-color="#1E1813" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#1E1813" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#1E1813" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1E1813" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.48" cy="0.44" r="0.82">
      <stop offset="0%" stop-color="#2B1F17" stop-opacity="0"/>
      <stop offset="62%" stop-color="#2B1F17" stop-opacity="0.02"/>
      <stop offset="88%" stop-color="#2B1F17" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2B1F17" stop-opacity="0.24"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="softSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="sheetShadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="6" dy="14" stdDeviation="18" flood-color="#2B1F17" flood-opacity="0.20"/>
    </filter>

    <filter id="sealShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="14" dy="24" stdDeviation="28" flood-color="#2B1F17" flood-opacity="0.45"/>
    </filter>

    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.74" numOctaves="4" seed="31" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.145  0 0 0 0 0.112  0 0 0 0 0.083  0.34 0.14 0 0 0"/>
    </filter>

    <filter id="typeShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#2B1F17" flood-opacity="0.20"/>
    </filter>

    <clipPath id="sheetClip">
      <rect x="60" y="50" width="1800" height="980"/>
    </clipPath>
  
    <linearGradient id="deadzoneShield" x1="1400" y1="760" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B1F17" stop-opacity="0"/>
      <stop offset="22%" stop-color="#2B1F17" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#251B13" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#1E1813" stop-opacity="0.97"/>
    </linearGradient>

    <radialGradient id="heroAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FAF7F0" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#F6D79B" stop-opacity="0.80"/>
      <stop offset="50%" stop-color="#D9822B" stop-opacity="0.40"/>
      <stop offset="80%" stop-color="#C2593F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C2593F" stop-opacity="0"/>
    </radialGradient>
</defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="url(#ground)"/>
  <rect width="1920" height="1080" fill="url(#ambient)"/>

  <!-- Archival Folio Base Sheet -->
  <g transform="rotate(-1.2 960 540)">
    <rect x="60" y="50" width="1800" height="980" fill="#EAE0D0" filter="url(#sheetShadow)"/>
    <rect x="60" y="50" width="1800" height="980" fill="none" stroke="#5C5248" stroke-width="4" opacity="0.40"/>

    <g clip-path="url(#sheetClip)">
      <!-- Folio Ruling Lines -->
      <g stroke="#5C5248" stroke-width="1.5" opacity="0.05">
        <path d="M130,190 L1790,190"/><path d="M130,238 L1790,238"/><path d="M130,286 L1790,286"/>
        <path d="M130,334 L1790,334"/><path d="M130,382 L1790,382"/><path d="M130,430 L1790,430"/>
        <path d="M130,478 L1790,478"/><path d="M130,526 L1790,526"/><path d="M130,574 L1790,574"/>
        <path d="M130,622 L1790,622"/><path d="M130,670 L1790,670"/><path d="M130,718 L1790,718"/>
        <path d="M130,766 L1790,766"/><path d="M130,814 L1790,814"/><path d="M130,862 L1790,862"/>
        <path d="M130,910 L1790,910"/><path d="M130,958 L1790,958"/>
      </g>

      <!-- Archival Script Scratches on Right -->
      <g fill="none" stroke="#5C5248" stroke-width="2.5" opacity="0.35" stroke-linecap="round">
        <path d="M980,166 C1050,158 1140,174 1230,164 C1320,154 1410,170 1500,162"/>
        <path d="M980,206 C1060,198 1150,214 1240,204 C1330,194 1420,210 1510,202"/>
        <path d="M980,246 C1040,238 1120,252 1200,244 C1280,236 1360,250 1440,242"/>
        <path d="M980,286 C1050,278 1140,292 1220,284 C1300,276 1380,290 1460,282"/>
      </g>

      <!-- Gutter Fold Shadow -->
      <path d="M880,50 L880,1030" stroke="#2B1F17" stroke-width="26" opacity="0.06"/>
      <path d="M886,50 L886,1030" stroke="#FAF7F0" stroke-width="10" opacity="0.30"/>
    </g>
  </g>

  <!-- Diagonal Archival Dividing Ray / Slicing Vector Rule -->
  <g stroke="#C89D42" stroke-width="8" opacity="0.70" stroke-linecap="round">
    <path d="M720,1080 L1460,0"/>
  </g>
  <g stroke="#C2593F" stroke-width="4" opacity="0.85" stroke-linecap="round">
    <path d="M726,1080 L1466,0"/>
  </g>

  <!-- Archetype 3: Colossal Macro/Micro Subject on Lower-Right (Centered at x=1260, y=560) -->
  <circle cx="1140" cy="560" r="420" fill="url(#heroAura)" opacity="0.4"/>
  
    <!-- Sharp Archival Compass Graticules on Right -->
    <g stroke="#8A6A2C" stroke-width="4" opacity="0.65" fill="none">
      <path d="M1140,240 L1140,880" stroke-dasharray="12 8"/>
      <path d="M820,560 L1460,560" stroke-dasharray="12 8"/>
      <circle cx="1140" cy="560" r="290" stroke-width="6" stroke-dasharray="24 16"/>
      <circle cx="1140" cy="560" r="210" stroke-width="5" stroke-dasharray="8 8"/>
    </g>
<g id="hero-subject" filter="url(#sealShadow)">
    <!-- Archival Reticle / Stamped Outer Ring -->
    <circle cx="1140" cy="560" r="380" fill="none" stroke="#C89D42" stroke-width="10" stroke-dasharray="18 12" opacity="0.4"/>
    <circle cx="1140" cy="560" r="350" fill="none" stroke="#C89D42" stroke-width="8" opacity="0.75"/>

    <!-- Wax Droplets & Irregular Edge -->
    <g fill="#9C3A24">
      <circle cx="1480" cy="560" r="46"/><circle cx="1460" cy="670" r="44"/>
      <circle cx="1400" cy="770" r="48"/><circle cx="1310" cy="840" r="50"/>
      <circle cx="960" cy="880" r="52"/><circle cx="960" cy="880" r="48"/>
      <circle cx="970" cy="840" r="52"/><circle cx="880" cy="760" r="46"/>
      <circle cx="820" cy="660" r="50"/><circle cx="810" cy="550" r="46"/>
      <circle cx="830" cy="440" r="48"/><circle cx="880" cy="350" r="52"/>
      <circle cx="960" cy="270" r="48"/><circle cx="1060" cy="230" r="52"/>
      <circle cx="1180" cy="230" r="46"/><circle cx="1290" cy="260" r="50"/>
      <circle cx="1380" cy="330" r="48"/><circle cx="1450" cy="420" r="52"/>
    </g>

    <!-- Main Wax Disc -->
    <circle cx="1140" cy="560" r="360" fill="url(#wax)"/>
    <circle cx="1140" cy="560" r="360" fill="url(#waxSheen)"/>
    <circle cx="1140" cy="560" r="320" fill="none" stroke="#FAF7F0" stroke-width="12" stroke-opacity="0.30"/>

    <!-- Right-edge wax rim light -->
    <path d="M 1416,328 A 360,360 0 0 1 1416,792" fill="none" stroke="#FAF7F0" stroke-width="14" opacity="0.62" stroke-linecap="round"/>

    <!-- Inner Seal Ring & Deep Stamped Impression -->
    <circle cx="1140" cy="560" r="260" fill="#6E2312" opacity="0.35"/>
    <circle cx="1140" cy="560" r="260" fill="none" stroke="#E07352" stroke-width="8" opacity="0.40"/>

    <!-- Roman Numeral X (Decemviri / Council of Ten) Emboss -->
    <g stroke="#6E2312" stroke-width="26" stroke-linecap="round" opacity="0.80">
      <path d="M1040,450 L1240,670"/>
      <path d="M1240,450 L1040,670"/>
    </g>
    <g stroke="#FAF7F0" stroke-width="10" stroke-linecap="round" opacity="0.75">
      <path d="M1036,446 L1236,666"/>
      <path d="M1236,446 L1036,666"/>
    </g>

    <!-- Brass Stiletto Dagger Piercing Document through Wax -->
    <g id="dagger">
      <!-- Dagger Drop Shadow -->
      <path d="M1400,310 L960,750 L920,780 L940,740 Z" fill="#1E1813" opacity="0.45" filter="url(#softSmall)"/>

      <!-- Steel/Brass Blade -->
      <polygon points="1320,390 940,750 1360,430" fill="url(#brassBlade)" stroke="#1E1813" stroke-width="8" stroke-linejoin="round"/>
      <line x1="1340" y1="410" x2="940" y2="750" stroke="#FAF7F0" stroke-width="12" stroke-linecap="round"/>

      <!-- Crossguard -->
      <polygon points="1300,360 1390,450 1360,480 1270,390" fill="#C89D42" stroke="#1E1813" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="1330" cy="420" r="14" fill="#C2593F" stroke="#1E1813" stroke-width="6"/>

      <!-- Handle / Hilt -->
      <path d="M1345,405 L1465,285" stroke="url(#daggerHandle)" stroke-width="22" stroke-linecap="round"/>
      <path d="M1345,405 L1465,285" stroke="#C89D42" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round"/>

      <!-- Pommel -->
      <circle cx="1475" cy="275" r="20" fill="#C89D42" stroke="#1E1813" stroke-width="8"/>
      <circle cx="1475" cy="275" r="8" fill="#C2593F"/>
    </g>

    <!-- Stamped Archival Reticle Inscription -->
    <text x="1140" y="800" text-anchor="middle" font-family="JetBrains Mono" font-size="24" letter-spacing="4" fill="#F6D79B" opacity="0.85">CONSIGLIO DEI DIECI</text>
  </g>

  <!-- Small Family Silhouette Group (Treason fleeing, contrasting scale) -->
  <g id="family" transform="translate(100, 30)">
    <g fill="#2B1F17" opacity="0.25" filter="url(#softSmall)">
      <ellipse cx="786" cy="948" rx="30" ry="9"/><ellipse cx="852" cy="948" rx="26" ry="8"/>
      <ellipse cx="914" cy="948" rx="20" ry="7"/>
    </g>

    <g fill="#1E1813" stroke="#C2593F" stroke-width="3" stroke-opacity="0.45" stroke-linejoin="round">
      <circle cx="778" cy="808" r="14"/>
      <path d="M766,822 C768,816 788,816 790,822 L794,890 L762,890 Z"/>
      <path d="M764,888 L777,888 L774,942 L762,942 Z"/>
      <path d="M779,888 L792,888 L794,942 L782,942 Z"/>
      <path d="M762,840 L750,872 L756,875 L768,848 Z"/>

      <circle cx="824" cy="858" r="10"/>
      <path d="M816,868 C818,864 830,864 832,868 L834,912 L814,912 Z"/>
      <path d="M816,910 L824,910 L822,942 L815,942 Z"/>
      <path d="M826,910 L834,910 L836,942 L829,942 Z"/>

      <circle cx="868" cy="802" r="15"/>
      <path d="M854,816 C856,810 880,810 882,816 L886,888 L852,888 Z"/>
      <path d="M854,886 L868,886 L865,942 L851,942 Z"/>
      <path d="M871,886 L885,886 L888,942 L874,942 Z"/>
      <path d="M883,834 L896,864 L890,868 L878,842 Z"/>
    </g>
  </g>

  <!-- Archetype 3: Text Stacked at Top-Left (x=120, y=340 & 500) -->
  <g filter="url(#typeShadow)">
    <text x="100" y="340" font-family="Instrument Serif" font-size="130" letter-spacing="-4"
          fill="#1E1813" stroke="#FAF7F0" stroke-width="14" stroke-linejoin="round" paint-order="stroke fill">HOSTAGE</text>
    <text x="100" y="496" font-family="Instrument Serif" font-size="130" letter-spacing="-3"
          fill="#1E1813" stroke="#FAF7F0" stroke-width="14" stroke-linejoin="round" paint-order="stroke fill">FAMILIES</text>
  </g>

  <!-- Divider Stripe below Text -->
  <g>
    <rect x="100" y="534" width="460" height="16" rx="8" fill="#C2593F"/>
    <rect x="100" y="534" width="150" height="16" rx="8" fill="#C89D42"/>
    <rect x="300" y="534" width="40" height="16" rx="8" fill="#2B1F17"/>
  </g>

  <!-- Archetype 3: Badge at Mid-Left (x=120, y=586) -->
  <g>
    <rect x="100" y="586" width="450" height="74" rx="37" fill="#EAE0D0" stroke="#1E1813" stroke-width="9"/>
    <circle cx="162" cy="623" r="18" fill="#C89D42" stroke="#1E1813" stroke-width="6"/>
    <circle cx="162" cy="623" r="7" fill="#2B1F17"/>
    <text x="196" y="634" font-family="JetBrains Mono" font-size="28" letter-spacing="1.5" fill="#1E1813">COUNCIL OF TEN</text>
  </g>

  <!-- Vignette & YouTube Bottom-Right Dead-Zone Shield (x: 1440-1920, y: 860-1080) -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" fill="url(#deadzoneShield)"/>
  <rect width="1920" height="1080" filter="url(#paper)" opacity="0.34"/>
</svg>