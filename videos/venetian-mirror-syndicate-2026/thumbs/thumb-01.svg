<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Great baroque looking-glass on warm linen, the lagoon and furnace glow held inside its plate, beside an engraved count of panes">
